<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGASIN MOINS CHER</title>
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta charset="utf-8">
<style>
  :root{
    --bleu:#1F3864; --bleu2:#2E4F8A; --orange:#C55A11; --fond:#F3F5F9; --carte:#FFFFFF;
    --texte:#1C2333; --gris:#6B7385; --ligne:#E2E6EE; --ok:#1E7B45; --err:#B3261E;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fond);color:var(--texte);font-size:15px}
  .cache{display:none!important}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--ligne);border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--bleu2);border-color:transparent}
  label{display:block;font-size:13px;font-weight:bold;color:var(--gris);margin:12px 0 5px}
  .btn{border:0;border-radius:8px;padding:10px 18px;background:var(--bleu);color:#fff;font-weight:bold}
  .btn:hover{background:var(--bleu2)}
  .btn.second{background:#fff;color:var(--bleu);border:1px solid var(--ligne)}
  .btn.orange{background:var(--orange)}
  .btn:disabled{opacity:.5;cursor:wait}

  /* Écrans d'accueil */
  .centre{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .carte-accueil{background:var(--carte);border-radius:14px;box-shadow:0 6px 24px rgba(31,56,100,.12);width:100%;max-width:420px;overflow:hidden}
  .carte-accueil header{background:var(--bleu);color:#fff;padding:22px 24px}
  .carte-accueil header h1{margin:0;font-size:20px;letter-spacing:.5px}
  .carte-accueil header p{margin:6px 0 0;font-size:13px;opacity:.85}
  .carte-accueil .corps{padding:20px 24px 24px}
  .liste-users{display:grid;gap:8px;max-height:260px;overflow:auto}
  .user{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--ligne);border-radius:10px;background:#fff;text-align:left}
  .user.actif{border-color:var(--bleu);background:#EEF2FA}
  .user small{color:var(--gris)}
  .pin{font-size:22px;letter-spacing:8px;text-align:center}
  .msg{margin-top:12px;font-size:13px;min-height:18px;color:var(--err)}

  /* Application */
  .barre{background:var(--bleu);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;position:sticky;top:0;z-index:5}
  .barre h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barre .qui{font-size:13px;text-align:right;line-height:1.2}
  .barre .qui small{opacity:.75}
  .barre .btn{background:rgba(255,255,255,.15);padding:8px 12px}
  .app{display:flex;min-height:calc(100vh - 56px)}
  nav{width:230px;background:#fff;border-right:1px solid var(--ligne);padding:12px 8px;flex-shrink:0}
  nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:8px;color:var(--texte)}
  nav button:hover{background:var(--fond)}
  nav button.actif{background:#EEF2FA;color:var(--bleu);font-weight:bold}
  nav button .etape{margin-left:auto;font-size:11px;color:var(--gris)}
  main{flex:1;padding:22px;min-width:0}
  main h2{margin:0 0 16px;font-size:21px;color:var(--bleu)}
  .bloc{background:var(--carte);border-radius:12px;border:1px solid var(--ligne);padding:18px}
  .onglets{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .onglets button{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:8px 16px}
  .onglets button.actif{background:var(--bleu);color:#fff;border-color:var(--bleu)}
  .grille{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .entete-bloc{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--gris);padding:10px;border-bottom:2px solid var(--ligne)}
  td{padding:11px 10px;border-bottom:1px solid var(--ligne)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#F7F9FC}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold}
  .badge.oui{background:#E3F4EA;color:var(--ok)}
  .badge.non{background:#F6E3E1;color:var(--err)}
  .vide{color:var(--gris);text-align:center;padding:28px}
  .bientot{text-align:center;padding:50px 20px;color:var(--gris)}
  .bientot b{display:block;font-size:18px;color:var(--bleu);margin-bottom:6px}

  /* Fenêtre modale */
  .voile{position:fixed;inset:0;background:rgba(20,30,50,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modale{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
  .modale h3{margin:0 0 6px;color:var(--bleu)}
  .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:10px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .toast.err{background:var(--err)}

  .modale.large{max-width:880px}
  .ligne-achat{display:grid;grid-template-columns:2.4fr .8fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .ligne-achat .st{text-align:right;font-weight:bold;white-space:nowrap}
  .ligne-achat .btn{padding:8px 12px}
  .totaux{display:flex;justify-content:flex-end;gap:24px;flex-wrap:wrap;margin-top:12px;font-size:15px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:14px}
  .stat small{color:var(--gris);display:block;margin-bottom:4px}
  .stat b{font-size:19px;color:var(--bleu)}

  .caisse{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
  .caisse > *{min-width:0}
  @media (max-width:1150px){ .caisse{grid-template-columns:1fr} .recap{position:static} }
  .recherche-art{position:relative}
  .recherche-art input{font-size:17px;padding:13px 14px}
  .suggs{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--ligne);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:10;max-height:380px;overflow:auto;margin-top:4px}
  .sugg{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--ligne)}
  .sugg:hover,.sugg.actif{background:#EEF2FA}
  .sugg small{color:var(--gris)}
  .sugg.rupture{opacity:.6}
  .sugg .droite{text-align:right;white-space:nowrap}
  .panier td{vertical-align:middle}
  .panier td input{padding:7px 8px;width:100px}
  .recap{position:sticky;top:70px}
  .recap .ligne{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
  .recap .net{font-size:22px;font-weight:bold;color:var(--bleu)}
  .monnaie{background:#E3F4EA;color:var(--ok);padding:12px 16px;border-radius:10px;font-size:18px;margin:0 0 14px}
  .fact{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:13px}
  .fact.apercu{border:1px solid var(--ligne);border-radius:8px;padding:20px}
  .fact .ent{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #1F3864;padding-bottom:12px;margin-bottom:14px}
  .fact h1{font-size:22px;margin:0 0 4px;color:#1F3864}
  .fact .num{text-align:right;white-space:nowrap}
  .fact .num b{font-size:18px;color:#C55A11}
  .fact table th{background:#1F3864;color:#fff;text-transform:none;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .fact table td{padding:7px 10px}
  .fact .tot{margin-left:auto;width:300px;max-width:100%;margin-top:10px}
  .fact .tot div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
  .fact .tot .net{font-size:16px;font-weight:bold;border-top:2px solid #111;padding-top:6px}
  .fact .lettres{margin-top:16px}
  .fact .pied{margin-top:36px;display:flex;justify-content:space-between;font-size:12px;color:#444}
  .fact .annulee{color:#B3261E;font-size:20px;font-weight:bold;text-align:center;border:3px solid #B3261E;padding:6px;margin-bottom:12px}
  #impression{display:none}
  @media print{
    body{background:#fff}
    body > *:not(#impression){display:none!important}
    #impression{display:block}
    @page{size:A4;margin:12mm}
  }


  /* ===== Aide intégrée ===== */
  .aide{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:#4A5468;background:#F2F6FC;border-left:3px solid var(--bleu2);border-radius:6px;padding:7px 10px;margin:6px 0 0}
  .aide::before{content:'i';flex:0 0 16px;height:16px;margin-top:1px;border-radius:50%;background:var(--bleu2);color:#fff;font:italic bold 11px/16px Georgia,serif;text-align:center}
  .info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#DDE5F2;color:var(--bleu);font:italic bold 11px/1 Georgia,serif;cursor:help;margin-left:6px;vertical-align:1px;outline:none}
  .info:hover,.info:focus,.info.ouvert{background:var(--bleu2);color:#fff}
  .info:hover::after,.info:focus::after,.info.ouvert::after{content:attr(data-tip);position:absolute;left:-10px;top:calc(100% + 9px);width:max-content;max-width:250px;background:#1C2333;color:#fff;font:normal 12.5px/1.45 Arial,sans-serif;padding:9px 11px;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.22);z-index:60;text-align:left;white-space:normal}
  .info.g::after{left:auto;right:-10px}
  .info.g::before{left:auto;right:2px}
  .info:hover::before,.info:focus::before,.info.ouvert::before{content:'';position:absolute;left:2px;top:calc(100% + 3px);border:6px solid transparent;border-bottom-color:#1C2333;border-top:0;z-index:61}
  .etat-vide{text-align:center;padding:34px 16px 30px;color:var(--gris)}
  .etat-vide .ico{width:66px;height:66px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#EEF2FA,#E2E9F6);display:flex;align-items:center;justify-content:center}
  .etat-vide b{display:block;color:var(--bleu);font-size:16px;margin-bottom:5px}
  .etat-vide p{margin:0 auto 14px;max-width:430px;line-height:1.45}
  .etat-vide.petit{padding:18px 10px}
  .etat-vide.petit .ico{width:48px;height:48px;margin-bottom:8px}
  .astuce{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,#FFF4EA,#FFFBF7);border:1px solid #F4CBA8;border-radius:12px;padding:12px 12px 12px 14px;margin-bottom:14px;animation:apparait .35s ease}
  .astuce .ampoule{flex:0 0 30px;height:30px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center}
  .astuce div{flex:1;font-size:13.5px;line-height:1.5;color:#3B3226}
  .astuce div b{color:var(--orange)}
  .astuce button{border:0;background:none;color:#A08C7A;font-size:20px;line-height:1;padding:0 4px;cursor:pointer}
  .astuce button:hover{color:var(--orange)}
  @keyframes apparait{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .aide-hero{background:linear-gradient(135deg,var(--bleu) 0%,var(--bleu2) 100%);color:#fff;border-radius:16px;padding:24px 24px 20px;margin-bottom:16px;position:relative;overflow:hidden}
  .aide-hero::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
  .aide-hero h2{color:#fff;margin:0 0 6px;font-size:22px}
  .aide-hero p{margin:0 0 14px;opacity:.88;max-width:560px;line-height:1.45}
  .aide-hero input{max-width:420px;border:0;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .aide-grille{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .guide{background:#fff;border:1px solid var(--ligne);border-radius:12px;overflow:hidden;transition:box-shadow .2s}
  .guide[open]{box-shadow:0 6px 20px rgba(31,56,100,.09)}
  .guide summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}
  .guide summary::-webkit-details-marker{display:none}
  .guide summary .pastille{width:38px;height:38px;border-radius:11px;background:#EEF2FA;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .guide summary .titre{font-weight:bold;color:var(--texte)}
  .guide summary small{display:block;font-weight:normal;color:var(--gris);font-size:12.5px;margin-top:2px}
  .guide summary::after{content:'›';margin-left:auto;font-size:24px;line-height:1;color:var(--gris);transition:transform .2s}
  .guide[open] summary::after{transform:rotate(90deg)}
  .guide ol{margin:0;padding:0 18px 6px 66px}
  .guide li{margin:7px 0;line-height:1.5}
  .guide .aide{margin:6px 16px 16px 66px}
  .etiquette{display:inline-block;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;background:#FBE9DC;color:var(--orange);margin-left:6px;vertical-align:1px}

  /* ===== Dépôts ===== */
  .depots-barre{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .depot-carte{border:1px solid var(--ligne);background:#fff;border-radius:12px;padding:8px 14px 8px 9px;cursor:pointer;text-align:left;font:inherit;color:var(--texte);display:flex;gap:10px;align-items:center;transition:box-shadow .15s,border-color .15s}
  .depot-carte:hover{border-color:var(--bleu2)}
  .depot-carte b{display:block;font-size:13.5px}
  .depot-carte small{color:var(--gris);font-size:12px}
  .depot-carte.actif{border-color:var(--bleu2);background:#EEF2FA;box-shadow:inset 0 0 0 1px var(--bleu2)}
  .depot-carte .pt{width:32px;height:32px;border-radius:9px;background:#EEF2FA;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .depot-carte.actif .pt{background:#fff}
  .repartition{display:block;font-size:12px;color:var(--gris);margin-top:2px}
  .repartition span{white-space:nowrap}
  .mag-tag{display:inline-block;font-size:10.5px;font-weight:bold;padding:1px 7px;border-radius:8px;background:#E3F1E7;color:var(--ok);margin-left:6px;vertical-align:1px}
  .ligne-achat.ligne-tr{grid-template-columns:2.4fr .9fr 1fr auto}
  .btn-ico{display:inline-flex;gap:7px;align-items:center}

  /* ===== Hors ligne ===== */
  .reseau{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:16px;padding:6px 12px;font:bold 12.5px Arial,Helvetica,sans-serif;cursor:pointer;white-space:nowrap}
  .reseau i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .reseau.ok{background:rgba(255,255,255,.14);color:#fff}.reseau.ok i{background:#5DD39E}
  .reseau.hl{background:#FDECEA;color:#8A1C14}.reseau.hl i{background:#B3261E}
  .reseau.att{background:#FFF1E3;color:#7A3A06}.reseau.att i{background:#C55A11}
  .reseau b{background:#C55A11;color:#fff;border-radius:10px;padding:2px 8px;font-size:11.5px}
  .facture-hl{border:1px dashed #999;padding:6px 8px;font-size:12px;margin:4px 0 8px}

  /* Téléphone */
  @media (max-width:760px){
    .app{flex-direction:column}
    nav{width:100%;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ligne);padding:6px}
    nav button{white-space:nowrap;width:auto}
    nav button .etape{display:none}
    main{padding:14px}
    .grille{grid-template-columns:1fr}
    .barre .qui small{display:none}
    .col-mobile-cache{display:none}
    .aide-grille{grid-template-columns:1fr}
    .ligne-achat.ligne-tr{grid-template-columns:1fr 1fr}
    .guide ol{padding-left:44px}
    .guide .aide{margin-left:16px}
    .ligne-achat{grid-template-columns:1fr 1fr;padding-bottom:8px;border-bottom:1px dashed var(--ligne)}
    .ligne-achat select{grid-column:1/-1}
    .caisse{grid-template-columns:1fr}
    .recap{position:static}
    .fact .ent{flex-direction:column}
    .fact .num{text-align:left}
  }
</style>
</head>
<body>

<!-- Chargement -->
<div id="ecran-chargement" class="centre"><p style="color:var(--gris)">Chargement…</p></div>

<!-- Premier lancement -->
<div id="ecran-installation" class="centre cache">
  <div class="carte-accueil">
    <header><h1 class="nom-ent">MAGASIN MOINS CHER</h1><p>Premier lancement — création du compte gérant</p></header>
    <div class="corps">
      <label>Nom et prénom du gérant</label>
      <input id="ins-nom" autocomplete="off">
      <label>Code PIN (4 à 6 chiffres)</label>
      <input id="ins-pin" class="pin" type="password" inputmode="numeric" maxlength="6">
      <label>Confirmer le code PIN</label>
      <input id="ins-pin2" class="pin" type="password" inputmode="numeric" maxlength="6">
      <button class="btn" style="width:100%;margin-top:18px" onclick="creerGerant(this)">Créer le compte</button>
      <div class="msg" id="ins-msg"></div>
    </div>
  </div>
</div>

<!-- Connexion -->
<div id="ecran-connexion" class="centre cache">
  <div class="carte-accueil">
    <header><h1 class="nom-ent">MAGASIN MOINS CHER</h1><p>Gestion des stocks &amp; caisses</p></header>
    <div class="corps">
      <label>Qui êtes-vous ?</label>
      <div id="liste-users" class="liste-users"></div>
      <label>Code PIN</label>
      <input id="con-pin" class="pin" type="password" inputmode="numeric" maxlength="6"
             onkeydown="if(event.key==='Enter')connexion(document.getElementById('btn-con'))">
      <button id="btn-con" class="btn" style="width:100%;margin-top:18px" onclick="connexion(this)">Se connecter</button>
      <div class="msg" id="con-msg"></div>
    </div>
  </div>
</div>

<!-- Application -->
<div id="ecran-app" class="cache">
  <div class="barre">
    <h1 class="nom-ent">MAGASIN MOINS CHER</h1>
    <button id="btn-installer" class="btn cache" onclick="installerApp()">Installer l'application</button>
    <button id="etat-reseau" class="reseau ok" onclick="ouvrirAttente()" aria-label="État de la connexion et ventes en attente"></button>
    <div class="qui"><span id="qui-nom"></span><br><small id="qui-fonction"></small></div>
    <button class="btn" onclick="deconnexion()">Quitter</button>
  </div>
  <div class="app">
    <nav id="menu"></nav>
    <main id="vue"></main>
  </div>
</div>

<div id="modale-zone"></div>
<div id="toast-zone"></div>
<div id="impression"></div>

<script>
/* ===== État ===== */
const S = { token: null, user: null, etat: null, data: null, vue: 'accueil', onglet: 'entreprise', choixUser: null };
let tokenMemoire = null;

/* ===== Application installable / hors ligne : réglages ===== */
const MODE_GAS = !!(window.google && google.script && google.script.run);   // ouvert depuis le lien Google
const APPS_URL = 'https://script.google.com/macros/s/AKfycbwAj_DbvAratU-GgQq2AFj0oUwBul6NPmX-VKFewRpS93JG7ZJQgO7tWRQDYXykPCNn/exec';
const HL = { en: true, envoi: false, local: false, install: null };
function lireL(k, def){ try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } }
function ecrireL(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }

const MODULES = [
  { id: 'accueil',     nom: 'Tableau de bord',          etape: 9, gerant: true, pret: true },
  { id: 'caisse',      nom: 'Caisse & ventes',          etape: 5, pret: true },
  { id: 'articles',    nom: 'Articles',                 etape: 2, pret: true },
  { id: 'achats',      nom: 'Achats & livraisons',      etape: 4, gerant: true, pret: true },
  { id: 'stock',       nom: 'Stock & inventaire',       etape: 7, pret: true },
  { id: 'tiers',       nom: 'Clients & fournisseurs',   etape: 3, pret: true },
  { id: 'depenses',    nom: 'Dépenses',                 etape: 6, pret: true },
  { id: 'impayes',     nom: 'Impayés & règlements',     etape: 8, pret: true },
  { id: 'parametres',  nom: 'Paramètres',               etape: 1, gerant: true, pret: true },
  { id: 'aide',        nom: 'Aide',                     etape: 0, pret: true }
];

/* ===== Outils ===== */
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function msgErreur(e){ return String((e && e.message) || e || 'Erreur inconnue').replace(/^Error:\s*/, ''); }

function memoire(){ return MODE_GAS ? sessionStorage : localStorage; }
function lireToken(){ try { return memoire().getItem('mmc_token') || tokenMemoire; } catch(e){ return tokenMemoire; } }
function ecrireToken(t){ tokenMemoire = t; try { t ? memoire().setItem('mmc_token', t) : memoire().removeItem('mmc_token'); } catch(e){} }

function erreurHL(texte){
  const e = new Error(texte || 'Pas de connexion internet : cette opération sera possible au retour de la connexion. La caisse, elle, fonctionne hors ligne.');
  e.horsLigne = true;
  return e;
}

function api(fn, ...args){
  if (HL.local && !/^api(Connexion|Etat)$/.test(fn)) return Promise.reject(erreurHL('Reconnectez-vous (code PIN) pour utiliser cet écran : vous êtes entré hors ligne.'));
  if (!navigator.onLine) { reseau(false); return Promise.reject(erreurHL()); }
  return (MODE_GAS ? appelGoogle(fn, args) : appelWeb(fn, args)).then(r => {
    reseau(true);
    if (ECRITURES.test(fn)) apresEcriture();
    return r;
  }, e => {
    if (e && e.horsLigne) { reseau(false); throw e; }
    reseau(true);
    if (msgErreur(e).indexOf('SESSION_EXPIREE') >= 0) {
      finSession(); toast('Session expirée : reconnectez-vous.', true);
      throw new Error('Session expirée.');
    }
    throw e;
  });
}

function appelGoogle(fn, args){
  return new Promise((ok, ko) => google.script.run
    .withSuccessHandler(ok)
    .withFailureHandler(e => ko(/NetworkError|HTTP 0|Failed to fetch|network/i.test(msgErreur(e)) ? erreurHL() : e))[fn](...args));
}

async function appelWeb(fn, args){
  let rep;
  try {
    const ctrl = new AbortController(), minuterie = setTimeout(() => ctrl.abort(), 60000);
    const res = await fetch(APPS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                        body: JSON.stringify({ fn: fn, args: args }), signal: ctrl.signal });
    clearTimeout(minuterie);
    rep = await res.json();
  } catch(e) { throw erreurHL(); }
  if (!rep || !rep.ok) throw new Error((rep && rep.e) || 'Erreur du serveur.');
  return rep.r;
}

/* ===== Affichage instantané : dernière version connue tout de suite, mise à jour en arrière-plan ===== */
const CACHE = {}, META = {};
const ECRITURES = /^api(Enregistrer|Annuler|Ajuster|Ajouter|Transferer|Synchroniser)/;
function viderCache(){ Object.keys(CACHE).forEach(k => delete CACHE[k]); Object.keys(META).forEach(k => delete META[k]); }
function cleCourante(){
  switch (S.vue) {
    case 'articles': return 'articles';
    case 'tiers': return 'tiers';
    case 'achats': return 'achats';
    case 'caisse': return C.onglet === 'historique' ? 'ventes:' + C.jour : 'caisse';
    case 'depenses': return 'depenses:' + D.mois;
    case 'stock': return 'stock';
    case 'impayes': return 'impayes:' + I.type;
    case 'accueil': return 'tb:' + B.du + ':' + B.au;
  }
  return '';
}
/** L'utilisateur est-il en train de saisir ? (on ne redessine pas sous ses doigts) */
function libre(){
  if ($('modale-zone').innerHTML) return false;
  const a = document.activeElement;
  return !(a && $('vue').contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
async function charger(cle, appel, afficherDonnees, titre, actif){
  actif = actif || (() => cleCourante() === cle);
  META[cle] = { appel: appel, afficher: afficherDonnees, actif: actif };
  const ancien = CACHE[cle];
  if (ancien) afficherDonnees(ancien, false);
  else if (titre) $('vue').innerHTML = '<h2>' + titre + '</h2><div class="bloc vide">Chargement…</div>';
  const jeton = S.token;
  let frais;
  try { frais = await appel(); } catch(e) {
    if (!ancien && jeton === S.token) {
      if (e.horsLigne && titre && actif()) $('vue').innerHTML = '<h2>' + titre + '</h2><div class="bloc">' + etatVide('horsligne', 'Pas de connexion internet',
        msgErreur(e), '<button class="btn orange" onclick="allerA(\'caisse\')">Aller à la caisse</button>') + '</div>';
      else toast(msgErreur(e), true);
    }
    return;
  }
  if (jeton !== S.token) return;
  const change = !ancien || JSON.stringify(frais) !== JSON.stringify(ancien);
  CACHE[cle] = frais;
  if (cle === 'caisse' && S.user) ecrireL('mmc_caisse_' + S.user.code, frais);
  if (actif() && (!ancien || change)) afficherDonnees(frais, !!ancien);
}
/** Après un enregistrement : les autres écrans seront rechargés, l'écran courant est rafraîchi en arrière-plan. */
function apresEcriture(){
  const jeton = S.token;
  Object.keys(CACHE).forEach(k => delete CACHE[k]);
  setTimeout(() => Object.keys(META).forEach(k => {
    const m = META[k];
    if (!m.actif()) return;
    m.appel().then(d => { if (jeton !== S.token) return; CACHE[k] = d; if (m.actif()) m.afficher(d, true); }).catch(() => {});
  }), 30);
}
/** Juste après la connexion : on prépare les écrans principaux pour qu'ils s'ouvrent instantanément. */
function prechargement(){
  if (!navigator.onLine || HL.local) return;
  const jeton = S.token, g = S.user.fonction === 'Gérant';
  const jour = aujourdhui(), mois = jour.slice(0, 7);
  const l = [['articles', () => api('apiArticles', jeton)], ['stock', () => api('apiStock', jeton)],
             ['tiers', () => api('apiTiers', jeton)], ['impayes:Client', () => api('apiImpayes', jeton, 'Client')],
             ['depenses:' + mois, () => api('apiDepenses', jeton, mois)], ['ventes:' + jour, () => api('apiVentes', jeton, jour)]];
  if (g) l.push(['achats', () => api('apiAchats', jeton)], ['tb:' + mois + '-01:' + jour, () => api('apiTableauBord', jeton, mois + '-01', jour)]);
  l.forEach((x, i) => setTimeout(() => {
    if (jeton !== S.token || CACHE[x[0]]) return;
    x[1]().then(d => { if (jeton === S.token && !CACHE[x[0]]) CACHE[x[0]] = d; }).catch(() => {});
  }, 400 + i * 150));
}

function reseau(etat){
  const avant = HL.en;
  HL.en = etat;
  majReseau();
  if (etat && !avant) setTimeout(() => synchroniser(), 800);
}
window.addEventListener('online', () => { HL.en = true; majReseau(); setTimeout(() => synchroniser(), 1500); });

setInterval(() => { if (S.user) synchroniser(); }, 60000);

/* --- connexion sans internet (comptes déjà connectés sur cet appareil) --- */
async function empreintePin(pin, sel){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(sel), iterations: 150000, hash: 'SHA-256' }, k, 256);
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
async function memoriserPin(user, pin){
  if (MODE_GAS || !(window.crypto && crypto.subtle)) return;
  try {
    const sel = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x => x.toString(16).padStart(2, '0')).join('');
    const tous = lireL('mmc_pins', {});
    tous[user.code] = { sel: sel, h: await empreintePin(pin, sel), user: user, t: Date.now() };
    ecrireL('mmc_pins', tous);
  } catch(e) {}
}
async function connexionLocale(code, pin){
  const v = lireL('mmc_pins', {})[code];
  if (!v || Date.now() - v.t > 30 * 86400000) throw new Error('Pas de connexion internet. Ce compte ne s\'est pas connecté sur cet appareil depuis 30 jours : il faut internet pour la première connexion.');
  const essais = lireL('mmc_essais', {}), e = essais[code] || { n: 0, t: 0 };
  if (e.n >= 5 && Date.now() - e.t < 300000) throw new Error('Trop d\'essais. Réessayez dans 5 minutes.');
  if (await empreintePin(pin, v.sel) !== v.h) {
    essais[code] = { n: (Date.now() - e.t < 300000 ? e.n : 0) + 1, t: Date.now() }; ecrireL('mmc_essais', essais);
    throw new Error('Code PIN incorrect.');
  }
  delete essais[code]; ecrireL('mmc_essais', essais);
  const moi = lireL('mmc_moi', null);
  S.user = v.user; S.token = moi && moi.user && moi.user.code === code ? moi.token : null;
  HL.local = !S.token;
  ouvrirApp();
  toast('Connexion hors ligne : la caisse fonctionne, les ventes seront envoyées au retour d\'internet.');
}

function reconnecter(){
  if (!S.user) return;
  modale('Reconnexion',
    aide('Internet est revenu. Tapez votre code PIN pour envoyer les ventes faites hors ligne et retrouver tous les écrans.') +
    '<label>Code PIN de ' + esc(S.user.nom) + '</label><input id="rc-pin" type="password" inputmode="numeric" maxlength="6">',
    async () => {
      HL.local = false;
      try {
        const pin = $('rc-pin').value, r = await api('apiConnexion', S.user.code, pin);
        S.token = r.token; S.user = r.utilisateur; ecrireToken(r.token); ecrireL('mmc_moi', { token: r.token, user: r.utilisateur });
        memoriserPin(r.utilisateur, pin);
      } catch(e) { if (!S.token) HL.local = true; throw e; }
      majReseau(); toast('Reconnecté'); synchroniser(true);
    });
}

/* --- ventes faites hors ligne --- */
function nouvelId(){
  try { return crypto.randomUUID(); } catch(e) {}
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
}
function numeroProvisoire(){
  let poste = lireL('mmc_poste', null);
  if (!poste) { poste = 'P' + Math.random().toString(36).slice(2, 5).toUpperCase(); ecrireL('mmc_poste', poste); }
  const n = (lireL('mmc_seq', 0) || 0) + 1; ecrireL('mmc_seq', n);
  return 'HL-' + poste + '-' + String(n).padStart(4, '0');
}
function dateHeure(d){
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/** Enregistre la vente sur l'appareil (mêmes contrôles que le serveur) et prépare une facture provisoire. */
function venteHorsLigne(v){
  const d = C.data, g = S.user.fonction === 'Gérant', besoin = {};
  let total = 0;
  const lignes = v.lignes.map((l, i) => {
    const a = d.articles.find(x => x.code === l.article), q = numVal(l.qte);
    if (!a) throw new Error('Ligne ' + (i + 1) + ' : article introuvable.');
    if (q <= 0) throw new Error('Ligne ' + (i + 1) + ' : la quantité doit être supérieure à 0.');
    const pu = g ? numVal(l.pu) : a.prix, m = Math.round(q * pu);
    besoin[a.code] = (besoin[a.code] || 0) + q; total += m;
    return { designation: a.designation, quantite: q, prixUnitaire: pu, montant: m };
  });
  Object.keys(besoin).forEach(c => {
    const a = d.articles.find(x => x.code === c);
    if (besoin[c] > a.stock) throw new Error('Stock insuffisant au magasin pour « ' + a.designation + ' » : ' + a.stock + ' disponible(s).');
  });
  const remise = numVal(v.remise);
  if (remise > 0 && !g) throw new Error('Seul le gérant peut accorder une remise.');
  if (remise > total) throw new Error('La remise dépasse le total.');
  const net = total - remise, verse = String(v.verse == null ? '' : v.verse).trim() === '' ? null : numVal(v.verse);
  const paye = verse === null ? net : Math.min(verse, net);
  const client = v.client ? (d.clients || []).find(c => c.code === v.client) : null;
  if (paye < net && !client) throw new Error('Vente à crédit : choisissez le client (il doit avoir une fiche).');
  const maintenant = new Date(), num = numeroProvisoire();
  v.numeroProvisoire = num;
  const f = { entreprise: d.entreprise || { nom: (S.etat && S.etat.entreprise) || 'MAGASIN MOINS CHER', devise: 'FCFA' },
    numero: num, date: dateHeure(maintenant), client: client ? client.nom : 'Client de passage', telephoneClient: client ? client.telephone : '',
    caissier: S.user.nom, codeCaissier: S.user.code, mode: v.mode, statut: 'Validée',
    total: total, remise: remise, net: net, paye: paye, reste: net - paye, lignes: lignes, horsLigne: true };
  const file = attente();
  file.push({ v: v, vendeur: S.user.code, vendeurNom: S.user.nom, date: maintenant.toISOString(), facture: f });
  if (!ecrireL('mmc_attente', file)) throw new Error('Impossible d\'enregistrer la vente sur cet appareil (mémoire pleine).');
  majReseau();
  return { numero: num, facture: f, monnaie: verse !== null && verse > net ? verse - net : 0 };
}

/** Envoie les ventes en attente. Une vente déjà reçue n'est jamais enregistrée deux fois (identifiant unique). */
async function synchroniser(manuel){
  if (HL.envoi || !S.user) return;
  const g = S.user.fonction === 'Gérant';
  const lot = attente().filter(x => g || x.vendeur === S.user.code);
  if (!lot.length) { if (manuel) toast('Aucune vente en attente.'); majReseau(); return; }
  if (!navigator.onLine) { if (manuel) toast('Toujours pas d\'internet : les ventes partiront dès son retour.', true); return; }
  if (HL.local || !S.token) { majReseau(); if (manuel) reconnecter(); return; }
  HL.envoi = true; majReseau();
  try {
    const part = lot.slice(0, 50);
    const r = await api('apiSynchroniserVentes', S.token, part.map(x => ({ v: x.v, vendeur: x.vendeur, date: x.date })));
    const ok = {}, erreurs = {}, alertes = [];
    r.resultats.forEach(x => {
      if (x.ok) { ok[x.idLocal] = x.numero; (x.alertes || []).forEach(a => alertes.push(x.provisoire + ' → ' + x.numero + ' : ' + a)); }
      else erreurs[x.idLocal] = x.erreur;
    });
    ecrireL('mmc_attente', attente().filter(x => !ok[x.v.idLocal]).map(x => erreurs[x.v.idLocal] ? Object.assign(x, { erreur: erreurs[x.v.idLocal] }) : x));
    ecrireL('mmc_envoyees', lireL('mmc_envoyees', []).concat(part.filter(x => ok[x.v.idLocal]).map(x =>
      ({ provisoire: x.v.numeroProvisoire, numero: ok[x.v.idLocal], date: x.facture.date, net: x.facture.net }))).slice(-100));
    const n = Object.keys(ok).length, ne = Object.keys(erreurs).length;
    if (n) toast(n + ' vente(s) faite(s) hors ligne envoyée(s)' + (ne ? ' — ' + ne + ' en erreur' : '') + '.', ne > 0);
    else if (ne && manuel) toast(ne + ' vente(s) n\'ont pas pu être envoyées : voir la liste.', true);
    if (alertes.length) afficherAlertes(alertes);
    if (lot.length > part.length && n) setTimeout(() => synchroniser(), 500);
  } catch(e) {
    if (manuel && !e.horsLigne) toast(msgErreur(e), true);
  } finally {
    HL.envoi = false; majReseau();
    if ($('liste-attente')) ouvrirAttente();
  }
}

function afficherAlertes(alertes){
  if ($('modale-zone').innerHTML) return toast(alertes.length + ' alerte(s) de stock : voir « en attente » en haut.', true);
  $('modale-zone').innerHTML = '<div class="voile"><div class="modale"><h3>Ventes hors ligne envoyées — à vérifier</h3>' +
    aide('Ces ventes ont été faites pendant la coupure alors qu\'un autre poste vendait aussi : le stock du magasin est devenu négatif. Comptez l\'article et corrigez le stock, ou faites un transfert.') +
    '<ul style="padding-left:18px;line-height:1.5">' + alertes.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul>' +
    '<div class="actions"><button class="btn orange" onclick="fermerModale()">Compris</button></div></div></div>';
}

function ouvrirAttente(){
  const file = attente(), env = lireL('mmc_envoyees', []).slice(-8).reverse(), g = S.user && S.user.fonction === 'Gérant';
  const en = enLigne();
  $('modale-zone').innerHTML = '<div class="voile"><div class="modale large"><h3>Ventes faites hors ligne</h3>' +
    '<p style="margin:4px 0 12px">' + (en ? (HL.local ? '<b style="color:var(--orange)">Internet est revenu : reconnectez-vous pour envoyer les ventes.</b>'
        : '<b style="color:var(--ok)">Connecté</b> — l\'envoi est automatique.') : '<b style="color:var(--err)">Hors ligne</b> — les ventes partiront automatiquement au retour d\'internet.') + '</p>' +
    '<div id="liste-attente">' + (file.length
      ? '<div style="overflow-x:auto"><table><thead><tr><th>N° provisoire</th><th>Date</th><th>Vendeur</th><th style="text-align:right">Montant</th><th></th></tr></thead><tbody>' +
        file.map((x, i) => '<tr style="cursor:default"><td><b>' + esc(x.v.numeroProvisoire) + '</b>' +
            (x.erreur ? '<br><small style="color:var(--err)">' + esc(x.erreur) + '</small>' : '') + '</td>' +
          '<td style="white-space:nowrap">' + esc(x.facture.date) + '</td><td>' + esc(x.vendeurNom) + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' + fcfa(x.facture.net) + '</td>' +
          '<td style="white-space:nowrap;text-align:right"><button class="btn second" onclick="revoirAttente(' + i + ')">Facture</button>' +
            (g && x.erreur ? ' <button class="btn second" onclick="retirerAttente(' + i + ', this)">Retirer</button>' : '') + '</td></tr>').join('') +
        '</tbody></table></div>'
      : etatVide('bouclier', 'Aucune vente en attente', 'Tout est envoyé.', '', true)) + '</div>' +
    (env.length ? '<p style="margin:16px 0 6px;font-weight:bold;color:var(--bleu)">Derniers envois</p><p style="margin:0;color:var(--gris);line-height:1.7">' +
      env.map(x => esc(x.provisoire) + ' → <b style="color:var(--texte)">' + esc(x.numero) + '</b>').join('<br>') + '</p>' : '') +
    '<div class="actions"><button class="btn second" onclick="fermerModale()">Fermer</button>' +
      (file.length ? '<button class="btn orange" onclick="synchroniser(true)">' + (en && HL.local ? 'Se reconnecter et envoyer' : 'Envoyer maintenant') + '</button>' : '') +
    '</div></div></div>';
}
function revoirAttente(i){ const x = attente()[i]; if (x) afficherFacture(x.facture, 0); }
function retirerAttente(i, btn){
  if (btn.dataset.ok !== '1') { btn.dataset.ok = '1'; btn.textContent = 'Confirmer ?'; return; }
  const f = attente(); f.splice(i, 1); ecrireL('mmc_attente', f); majReseau(); ouvrirAttente();
}

};
const MAG = 'MAG';
function ico(n, t, c){ return '<svg width="' + (t || 24) + '" height="' + (t || 24) + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || 'currentColor') +
  '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICO[n] + '</svg>'; }
function aide(t){ return '<p class="aide"><span>' + t + '</span></p>'; }
function info(t){ return '<span class="info" tabindex="0" role="note" aria-label="' + esc(t) + '" data-tip="' + esc(t) + '" ' +
  'onclick="event.preventDefault();event.stopPropagation();this.classList.toggle(\'ouvert\')">i</span>'; }
function etatVide(icone, titre, texte, bouton, petit){
  return '<div class="etat-vide' + (petit ? ' petit' : '') + '"><div class="ico">' + ico(icone, petit ? 24 : 30, 'var(--bleu2)') + '</div><b>' + titre + '</b>' +
    (texte ? '<p>' + texte + '</p>' : '') + (bouton || '') + '</div>';
}
const ASTUCES_VUES = {};
function cleAstuce(cle){ return 'mmc_astuce_' + (S.user ? S.user.code : '') + '_' + cle; }
function astuce(cle, html){
  const k = cleAstuce(cle);
  if (ASTUCES_VUES[k]) return '';
  try { if (localStorage.getItem(k)) return ''; } catch(e) {}
  return '<div class="astuce" id="ast-' + cle + '"><span class="ampoule">' + ico('ampoule', 17, '#fff') + '</span><div>' + html + '</div>' +
    '<button title="Masquer cette astuce" aria-label="Masquer cette astuce" onclick="masquerAstuce(\'' + cle + '\')">×</button></div>';
}
function masquerAstuce(cle){
  const k = cleAstuce(cle); ASTUCES_VUES[k] = 1;
  try { localStorage.setItem(k, '1'); } catch(e) {}
  const e = $('ast-' + cle); if (e) e.remove();
}
function reafficherAstuces(){
  Object.keys(ASTUCES_VUES).forEach(k => delete ASTUCES_VUES[k]);
  try { Object.keys(localStorage).filter(k => k.indexOf(cleAstuce('')) === 0).forEach(k => localStorage.removeItem(k)); } catch(e) {}
  toast('Les astuces s\'afficheront à nouveau');
}
document.addEventListener('click', () => document.querySelectorAll('.info.ouvert').forEach(x => x.classList.remove('ouvert')));
['mouseover', 'focusin', 'touchstart'].forEach(ev => document.addEventListener(ev, e => {
  const i = e.target.closest && e.target.closest('.info'); if (!i) return;
  const c = i.closest('.modale,.bloc,main') || document.body, r = i.getBoundingClientRect(), b = c.getBoundingClientRect();
  i.classList.toggle('g', r.left + 255 > Math.min(b.right, window.innerWidth));
}, { passive: true }));

function afficher(ecran){
  ['chargement','installation','connexion','app'].forEach(n => $('ecran-' + n).classList.toggle('cache', n !== ecran));
}

function toast(texte, erreur){
  const z = $('toast-zone');
  z.innerHTML = '<div class="toast' + (erreur ? ' err' : '') + '">' + esc(texte) + '</div>';
  clearTimeout(toast._t); toast._t = setTimeout(() => z.innerHTML = '', 3200);
}

async function occupe(btn, fn){
  if (btn) btn.disabled = true;
  try { await fn(); } finally { if (btn) btn.disabled = false; }
}

/* ===== Démarrage ===== */
async function demarrer(){
  try {
    try { S.etat = await api('apiEtat'); ecrireL('mmc_etat', S.etat); }
    catch(e) { if (!e.horsLigne || !(S.etat = lireL('mmc_etat', null))) throw e; }
    document.querySelectorAll('.nom-ent').forEach(e => e.textContent = S.etat.entreprise);
    if (S.etat.premierLancement) return afficher('installation');
    const t = lireToken(), moi = lireL('mmc_moi', null);
    if (t) {
      try { S.user = await api('apiMoi', t); S.token = t; return ouvrirApp(); }
      catch(e) {
        if (e.horsLigne && moi && moi.token === t) { S.user = moi.user; S.token = t; return ouvrirApp(); }
        ecrireToken(null);
      }
    }
    ecranConnexion();
  } catch(e) {
    $('ecran-chargement').innerHTML = '<p style="color:var(--err);max-width:420px;text-align:center;line-height:1.5">' + (e.horsLigne
      ? 'Pas de connexion internet. La toute première ouverture sur cet appareil a besoin d\'internet ; ensuite, la caisse fonctionnera même hors ligne.'
      : 'Impossible de charger : ' + esc(msgErreur(e))) + '</p>';
  }
}

function ecranConnexion(){
  S.choixUser = null;
  $('con-pin').value = ''; $('con-msg').textContent = '';
  $('liste-users').innerHTML = S.etat.utilisateurs.map(u =>
    '<button class="user" data-code="' + esc(u.code) + '" onclick="choisirUser(this)">' +
    '<span>' + esc(u.nom) + '</span><small>' + esc(u.fonction) + '</small></button>').join('');
  afficher('connexion');
}

function choisirUser(b){
  document.querySelectorAll('.user').forEach(x => x.classList.remove('actif'));
  b.classList.add('actif'); S.choixUser = b.dataset.code; $('con-pin').focus();
  if (!navigator.onLine) $('con-msg').textContent = 'Hors ligne : seuls les comptes déjà connectés sur cet appareil peuvent entrer.';
}

async function creerGerant(btn){
  const nom = $('ins-nom').value.trim(), p1 = $('ins-pin').value, p2 = $('ins-pin2').value;
  $('ins-msg').textContent = '';
  if (p1 !== p2) { $('ins-msg').textContent = 'Les deux codes PIN ne sont pas identiques.'; return; }
  await occupe(btn, async () => {
    try { const r = await api('apiCreerGerant', nom, p1); entrer(r); }
    catch(e) { $('ins-msg').textContent = msgErreur(e); }
  });
}

async function connexion(btn){
  $('con-msg').textContent = '';
  if (!S.choixUser) { $('con-msg').textContent = 'Choisissez votre nom.'; return; }
  const pin = $('con-pin').value;
  await occupe(btn, async () => {
    try { const r = await api('apiConnexion', S.choixUser, pin); entrer(r); memoriserPin(r.utilisateur, pin); }
    catch(e) {
      if (e.horsLigne && !MODE_GAS) {
        try { await connexionLocale(S.choixUser, pin); return; } catch(e2) { e = e2; }
      }
      $('con-msg').textContent = msgErreur(e); $('con-pin').value = '';
    }
  });
}

function entrer(r){ S.token = r.token; S.user = r.utilisateur; HL.local = false; ecrireToken(r.token);
  if (!MODE_GAS) ecrireL('mmc_moi', { token: r.token, user: r.utilisateur });
  ouvrirApp(); }

async function deconnexion(){
  const t = S.token; ecrireL('mmc_moi', null); finSession();
  try { await api('apiDeconnexion', t); } catch(e) {}
}

async function finSession(){
  S.token = null; S.user = null; S.data = null; HL.local = false; ecrireToken(null);
  reinitialiserEcrans();
  viderCache();
  try { S.etat = await api('apiEtat'); } catch(e) {}
  ecranConnexion();
}

async function vueArticles(){

function dessinerArticles(){
  const d = A.data, g = d.gerant;
  $('vue').innerHTML = '<h2>Articles</h2><div class="bloc">' +
    '<div class="entete-bloc" style="flex-wrap:wrap">' +

      '<span style="flex:1"></span>' +

function listeArticles(){
  const d = A.data, g = d.gerant, r = A.recherche.trim().toLowerCase();
  const l = d.articles.filter(a => (!A.famille || a.famille === A.famille) &&
    (!r || a.designation.toLowerCase().indexOf(r) >= 0 || a.code.toLowerCase().indexOf(r) >= 0));
  if (!l.length) {
    $('a-liste').innerHTML = d.articles.length
      ? etatVide('boite', 'Aucun article ne correspond', 'Essayez un autre mot ou une autre famille.')
      : etatVide('boite', 'Aucun article pour le moment', g ? 'Créez vos articles un par un. Chaque taille ou modèle est un article séparé, avec son prix et son stock.' : 'Le gérant n\'a pas encore créé d\'articles.',
          g ? '<button class="btn orange" onclick="ficheArticle()">+ Ajouter un article</button>' : '');
    return;
  }
  const alertes = l.filter(a => a.actif === 'Oui' && a.stock <= a.seuilEffectif).length;
  $('a-liste').innerHTML =
    '<p style="color:var(--gris);margin:0 0 10px">' + l.length + ' article(s)' +
      (alertes ? ' · <b style="color:var(--err)">' + alertes + ' en stock bas</b>' : '') + '</p>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Code</th><th>Désignation</th><th class="col-mobile-cache">Famille</th>' +
    (g ? '<th class="col-mobile-cache">P. achat</th>' : '') + '<th>P. vente</th>' +
    (g ? '<th class="col-mobile-cache">Marge</th>' : '') + '<th>Stock</th><th class="col-mobile-cache">Actif</th></tr></thead><tbody>' +
    l.map(a => {
      const bas = a.stock <= a.seuilEffectif;
      return '<tr' + (g ? ' onclick="ficheArticle(\'' + esc(a.code) + '\')"' : ' style="cursor:default"') + '>' +
        '<td>' + esc(a.code) + '</td><td><b>' + esc(a.designation) + '</b></td>' +
        '<td class="col-mobile-cache">' + esc(a.famille) + '</td>' +
        (g ? '<td class="col-mobile-cache">' + fcfa(a.prixAchat) + '</td>' : '') + '<td>' + fcfa(a.prixVente) + '</td>' +
        (g ? '<td class="col-mobile-cache" style="color:' + (a.marge < 0 ? 'var(--err)' : 'var(--ok)') + '">' + fcfa(a.marge) + '</td>' : '') +
        '<td><span class="badge ' + (bas ? 'non' : 'oui') + '">' + a.stock.toLocaleString('fr-FR') + ' ' + esc(a.unite.toLowerCase()) + '</span></td>' +

function ficheArticle(code){

    '</div>' +
    ((d.depots || []).length > 1 ? '<label>Où est rangé ce stock de départ ?</label><select id="a-depot">' +
      d.depots.map(x => '<option value="' + esc(x.code) + '"' + (x.code === (a.depot || MAG) ? ' selected' : '') + '>' + esc(x.nom) + '</option>').join('') + '</select>' : '') +
    aide('Le stock de départ est la quantité présente le jour de la création de l\'article' + ((d.depots || []).length > 1 ? ', à l\'endroit choisi' : '') +
      '. Pour une nouvelle livraison, passez par <b>Achats & livraisons</b>.') +
    '<label>Actif</label>' + selectOuiNon('a-actif', a.actif) +
    '<p id="a-marge" style="margin:14px 0 0;font-weight:bold"></p>',
    async () => {
      A.data = await api('apiEnregistrerArticle', S.token, {

function calcMarge(){
  const n = v => Number(String(v).replace(/\s/g, '').replace(',', '.')) || 0;
  const m = n($('a-pv').value) - n($('a-pa').value);
  const e = $('a-marge');
  e.textContent = 'Marge par unité : ' + fcfa(m) + (m < 0 ? ' — attention, vente à perte !' : '');
  e.style.color = m < 0 ? 'var(--err)' : 'var(--ok)';
}


/* ===== Étape 3 : Clients & fournisseurs ===== */

/* ===== Étape 4 : Achats & livraisons ===== */
const H = { data: null, recherche: '', lignes: [] };
function numVal(v){ return Number(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')) || 0; }

async function vueAchats(){

function dessinerAchats(){
  const d = H.data, now = new Date();

  const valides = d.achats.filter(a => a.statut !== 'Annulé');
  const totalMois = valides.filter(a => a.date.slice(3) === mois).reduce((s, a) => s + a.total, 0);

  $('vue').innerHTML = '<h2>Achats & livraisons</h2>' +
    '<div class="stats">' +
      '<div class="stat"><small>Achats ce mois-ci</small><b>' + fcfa(totalMois) + '</b></div>' +
      '<div class="stat"><small>Reste dû aux fournisseurs</small><b style="color:' + (resteDu ? 'var(--err)' : 'var(--ok)') + '">' + fcfa(resteDu) + '</b></div>' +
      '<div class="stat"><small>Nombre d\'achats</small><b>' + valides.length + '</b></div>' +
    '</div><div class="bloc">' +
    '<div class="entete-bloc" style="flex-wrap:wrap">' +
      '<input placeholder="Rechercher (n°, fournisseur, BL)…" style="max-width:300px" value="' + esc(H.recherche) + '" oninput="H.recherche=this.value;listeAchats()">' +

    '</div><div id="h-liste"></div></div>';

function listeAchats(){
  const r = H.recherche.trim().toLowerCase();
  const l = H.data.achats.filter(a => !r || (a.numero + ' ' + a.fournisseur + ' ' + a.refBL).toLowerCase().indexOf(r) >= 0);
  if (!l.length) {

    l.map(a => '<tr onclick="detailAchat(\'' + esc(a.numero) + '\')"' + (a.statut === 'Annulé' ? ' style="opacity:.55"' : '') + '>' +

      '<td class="col-mobile-cache">' + esc(a.refBL) + '</td><td>' + fcfa(a.total) + '</td>' +

      '<td style="color:' + (a.reste > 0 ? 'var(--err)' : 'var(--ok)') + '">' + fcfa(a.reste) + '</td>' +
      '<td class="col-mobile-cache"><span class="badge ' + (a.statut === 'Annulé' ? 'non' : 'oui') + '">' + esc(a.statut) + '</span></td></tr>').join('') +

function nouvelAchat(){

      '<div><label>N° du bon de livraison (facultatif)</label><input id="h-bl"></div>' +
      ((d.depots || []).length > 1 ? '<div><label>Dépôt de réception' + info('L\'endroit où la marchandise est rangée à l\'arrivée. Pour la vendre, elle doit être au magasin : faites ensuite un transfert si besoin.') +
        '</label><select id="h-depot">' + d.depots.map(x => '<option value="' + esc(x.code) + '"' + (x.code === MAG ? ' selected' : '') + '>' + esc(x.nom) + '</option>').join('') + '</select></div>' : '') +
    '</div>' +
    '<label style="margin-top:18px">Articles reçus</label><div id="h-lignes"></div>' +
    '<button class="btn second" onclick="H.lignes.push({article:\'\',qte:\'\',pu:\'\'});dessinerLignesAchat()">+ Ajouter une ligne</button>' +
    '<div class="totaux"><span>Total : <b id="h-total"></b></span></div>' +
    '<div class="grille">' +
      '<div><label>Montant payé au fournisseur</label><div style="display:flex;gap:8px"><input id="h-paye" inputmode="decimal" value="0" oninput="totalAchat()">' +
        '<button class="btn second" style="white-space:nowrap" onclick="$(\'h-paye\').value=H.total;totalAchat()">Tout payé</button></div>' +
        aide('Le reste sera suivi dans <b>Impayés → fournisseurs</b>.') + '</div>' +
      '<div><label>Reste à payer</label><p id="h-reste" style="font-weight:bold;margin:10px 0 0"></p></div>' +
    '</div>' +
    '<label style="display:flex;gap:8px;align-items:center;font-weight:normal;color:var(--texte)">' +
      '<input id="h-maj" type="checkbox" checked style="width:auto"> Mettre à jour le prix d\'achat des articles avec ces prix</label>',
    async () => {
      const r = await api('apiEnregistrerAchat', S.token, {
        fournisseur: $('h-four').value, date: $('h-date').value, refBL: $('h-bl').value, depot: $('h-depot') ? $('h-depot').value : MAG,
        lignes: H.lignes, paye: $('h-paye').value, majPrix: $('h-maj').checked });
      H.data = r; toast('Achat ' + r.numeroCree + ' enregistré — stock mis à jour'); dessinerAchats();
    }, true);
  dessinerLignesAchat();
}

function dessinerLignesAchat(){
  const arts = H.data.articles;
  $('h-lignes').innerHTML = H.lignes.map((l, i) =>
    '<div class="ligne-achat">' +
      '<select onchange="choisirArticleAchat(' + i + ',this.value)"><option value="">— Article —</option>' +
        arts.map(a => '<option value="' + esc(a.code) + '"' + (a.code === l.article ? ' selected' : '') + '>' + esc(a.designation) + '</option>').join('') + '</select>' +
      '<input inputmode="decimal" placeholder="Qté" value="' + esc(l.qte) + '" oninput="H.lignes[' + i + '].qte=this.value;totalAchat()">' +
      '<input inputmode="decimal" placeholder="Prix unitaire" value="' + esc(l.pu) + '" oninput="H.lignes[' + i + '].pu=this.value;totalAchat()">' +
      '<span class="st" id="h-st-' + i + '"></span>' +
      '<button class="btn second" title="Retirer la ligne" onclick="retirerLigneAchat(' + i + ')">✕</button>' +
    '</div>').join('');
  totalAchat();
}

function choisirArticleAchat(i, code){
  const a = H.data.articles.find(x => x.code === code);
  H.lignes[i].article = code;
  if (a && H.lignes[i].pu === '') H.lignes[i].pu = String(a.prixAchat || '');
  dessinerLignesAchat();
}

function retirerLigneAchat(i){
  H.lignes.splice(i, 1);
  if (!H.lignes.length) H.lignes.push({ article: '', qte: '', pu: '' });
  dessinerLignesAchat();
}

function totalAchat(){
  let t = 0;
  H.lignes.forEach((l, i) => {
    const m = Math.round(numVal(l.qte) * numVal(l.pu));
    t += m;
    const e = $('h-st-' + i); if (e) e.textContent = l.article ? fcfa(m) : '';
  });
  H.total = t;
  $('h-total').textContent = fcfa(t);
  const reste = t - numVal($('h-paye').value);
  $('h-reste').textContent = fcfa(reste);
  $('h-reste').style.color = reste > 0 ? 'var(--err)' : 'var(--ok)';
}

/* ===== Étape 5 : Caisse & ventes ===== */
const C = { data: null, panier: [], onglet: 'vente', sugg: [], sel: 0, jour: null, client: '', facture: null };

function enLettres(n){
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return 'Zéro';
  const u = ['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
  const d = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const diz = x => {
    if (x < 20) return u[x];
    const t = Math.floor(x / 10), o = x % 10;
    if (t === 7 || t === 9) return d[t] + (t === 7 && o === 1 ? ' et ' : '-') + u[10 + o];
    if (o === 0) return d[t] + (t === 8 ? 's' : '');
    return d[t] + (o === 1 && t !== 8 ? ' et un' : '-' + u[o]);
  };
  const cent = x => {
    const c = Math.floor(x / 100), r = x % 100;
    let s = c ? (c > 1 ? u[c] + ' cent' + (r === 0 ? 's' : '') : 'cent') : '';
    if (r) s += (s ? ' ' : '') + diz(r);
    return s;
  };
  const sansS = s => s.replace(/cents$/, 'cent').replace(/vingts$/, 'vingt');
  const p = [];
  const mrd = Math.floor(n / 1e9), mio = Math.floor(n % 1e9 / 1e6), k = Math.floor(n % 1e6 / 1000), r = n % 1000;
  if (mrd) p.push(cent(mrd) + ' milliard' + (mrd > 1 ? 's' : ''));
  if (mio) p.push(cent(mio) + ' million' + (mio > 1 ? 's' : ''));
  if (k) p.push(k === 1 ? 'mille' : sansS(cent(k)) + ' mille');
  if (r) p.push(cent(r));
  const s = p.join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function suggestions(q){
  const box = $('c-sugg');
  q = String(q || '').trim().toLowerCase();
  if (!q) { box.classList.add('cache'); C.sugg = []; return; }
  C.sugg = C.data.articles.filter(a => (a.designation + ' ' + a.code + ' ' + a.famille).toLowerCase().indexOf(q) >= 0).slice(0, 8);
  if (C.sel >= C.sugg.length) C.sel = 0;
  box.innerHTML = C.sugg.length ? C.sugg.map((a, i) =>
    '<div class="sugg' + (i === C.sel ? ' actif' : '') + (a.stock <= 0 ? ' rupture' : '') + '" onmousedown="ajouterAuPanier(\'' + esc(a.code) + '\')">' +
      '<span><b>' + esc(a.designation) + '</b><br><small>' + esc(a.code) + ' · ' + esc(a.famille) + '</small></span>' +
      '<span class="droite"><b>' + fcfa(a.prix) + '</b><br><span class="badge ' + (a.stock > 0 ? 'oui' : 'non') + '">' +
        (a.stock > 0 ? 'Stock : ' + a.stock.toLocaleString('fr-FR') + ' ' + esc(a.unite.toLowerCase()) : 'Rupture') + '</span>' +
        (a.reserve > 0 ? '<br><small style="color:var(--gris)">+ ' + a.reserve.toLocaleString('fr-FR') + ' en dépôt</small>' : '') + '</span>' +
    '</div>').join('') : '<div class="sugg" style="cursor:default;color:var(--gris)">Aucun article trouvé</div>';
  box.classList.remove('cache');
}

function clavierSugg(e){
  if (!C.sugg.length) return;
  if (e.key === 'ArrowDown') { C.sel = Math.min(C.sel + 1, C.sugg.length - 1); suggestions(e.target.value); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { C.sel = Math.max(C.sel - 1, 0); suggestions(e.target.value); e.preventDefault(); }
  else if (e.key === 'Enter') { ajouterAuPanier(C.sugg[C.sel].code); e.preventDefault(); }
  else if (e.key === 'Escape') $('c-sugg').classList.add('cache');
}

function ajouterAuPanier(code){
  const a = C.data.articles.find(x => x.code === code);
  if (!a) return;
  const l = C.panier.find(x => x.article === code);
  const deja = l ? numVal(l.qte) : 0;
  if (deja + 1 > a.stock) {
    toast((a.stock > 0 ? 'Stock insuffisant au magasin : ' + a.stock + ' disponible(s).' : 'Rupture au magasin : « ' + a.designation + ' ».') +
      (a.reserve > 0 ? ' ' + a.reserve + ' en dépôt : demandez un transfert vers le magasin.' : ''), true);
  } else if (l) {
    l.qte = String(deja + 1);
  } else {
    C.panier.push({ article: a.code, designation: a.designation, unite: a.unite, stock: a.stock, qte: '1', pu: String(a.prix) });
  }
  $('c-rech').value = ''; C.sugg = []; $('c-sugg').classList.add('cache');
  dessinerPanier();
  $('c-rech').focus();
}

function dessinerPanier(){
  const g = C.data.gerant;
  if (!C.panier.length) {
    $('c-panier').innerHTML = etatVide('panier', 'Le panier est vide', 'Recherchez un article dans le champ ci-dessous.', '', true);
    totauxVente(); return;

    C.panier.map((l, i) => {
      const trop = numVal(l.qte) > l.stock;
      return '<tr style="cursor:default"><td><b>' + esc(l.designation) + '</b><br><small style="color:var(--gris)">Stock dispo : ' +
          l.stock.toLocaleString('fr-FR') + ' ' + esc(l.unite.toLowerCase()) + '</small></td>' +
        '<td><input inputmode="decimal" value="' + esc(l.qte) + '" style="width:70px' + (trop ? ';border-color:var(--err)' : '') + '" ' +
          'oninput="C.panier[' + i + '].qte=this.value;this.style.borderColor=numVal(this.value)>C.panier[' + i + '].stock?\'var(--err)\':\'\';majLigne(' + i + ')"></td>' +
        '<td>' + (g ? '<input inputmode="decimal" value="' + esc(l.pu) + '" oninput="C.panier[' + i + '].pu=this.value;majLigne(' + i + ')">' : fcfa(l.pu)) + '</td>' +
        '<td id="c-m-' + i + '" style="white-space:nowrap">' + fcfa(Math.round(numVal(l.qte) * numVal(l.pu))) + '</td>' +
        '<td><button class="btn second" style="padding:6px 10px" title="Retirer" onclick="C.panier.splice(' + i + ',1);dessinerPanier()">✕</button></td></tr>';
    }).join('') + '</tbody></table></div>';

function majLigne(i){

function totauxVente(){
  if (!$('c-total')) return;
  const total = C.panier.reduce((s, l) => s + Math.round(numVal(l.qte) * numVal(l.pu)), 0);
  if (C.ajout) {
    const aj = C.ajout, vs = $('c-verse').value.trim(), verse = vs === '' ? total : numVal(vs);
    const du = total + aj.reste, e = $('c-solde');
    $('c-total').textContent = fcfa(total);
    $('c-net').textContent = fcfa(aj.net + total);
    if (verse > du) e.innerHTML = '<span>Monnaie à rendre</span><b style="color:var(--ok)">' + fcfa(verse - du) + '</b>';
    else if (verse < du) e.innerHTML = '<span>Reste dû (crédit)</span><b style="color:var(--err)">' + fcfa(du - verse) + '</b>';
    else e.innerHTML = '<span>Paiement</span><b style="color:var(--ok)">Soldé</b>';
    return;
  }
  const net = Math.max(0, total - numVal($('c-remise').value));
  const vs = $('c-verse').value.trim();
  const verse = vs === '' ? net : numVal(vs);
  $('c-total').textContent = fcfa(total);
  $('c-net').textContent = fcfa(net);
  const e = $('c-solde');
  if (verse > net) e.innerHTML = '<span>Monnaie à rendre</span><b style="color:var(--ok)">' + fcfa(verse - net) + '</b>';
  else if (verse < net) e.innerHTML = '<span>Reste dû (crédit)</span><b style="color:var(--err)">' + fcfa(net - verse) + '</b>';
  else e.innerHTML = '<span>Paiement</span><b style="color:var(--ok)">Comptant</b>';
}

async function validerVente(btn){
  if (!C.panier.length) return toast('Le panier est vide.', true);
  await occupe(btn, async () => {
    try {
      const lignes = C.panier.map(l => ({ article: l.article, qte: l.qte, pu: l.pu }));
      let r;
      if (C.ajout) r = await api('apiAjouterArticlesVente', S.token, C.ajout.numero, { lignes: lignes, verse: $('c-verse').value });
      else {
        const v = { lignes: lignes, client: $('c-client').value, mode: $('c-mode').value, remise: $('c-remise') ? $('c-remise').value : '',
                    verse: $('c-verse').value, idLocal: C.idLocal || (C.idLocal = nouvelId()) };
        try { r = await api('apiEnregistrerVente', S.token, v); }
        catch(e) { if (!e.horsLigne) throw e; r = venteHorsLigne(v); }
      }
      C.ajout = null; C.idLocal = null;
      C.panier.forEach(l => { const a = C.data.articles.find(x => x.code === l.article); if (a) a.stock -= numVal(l.qte); });
      if (S.user) ecrireL('mmc_caisse_' + S.user.code, C.data);
      C.panier = []; C.client = '';
      ecranVente();
      afficherFacture(r.facture, r.monnaie);
    } catch(e) { toast(msgErreur(e), true); }
  });
}
