  if (f.statut === 'Annulée') extra = '<p style="color:var(--err);margin-top:12px">Motif d\'annulation : ' + esc(f.motif) + '</p>';
  else if (C.data.gerant) extra = '<details style="margin-top:16px"><summary style="cursor:pointer;color:var(--err)">Annuler cette vente</summary>' +
    '<label>Motif de l\'annulation (le stock sera remis)</label><input id="v-motif">' +
    '<div class="actions"><button class="btn" style="background:var(--err)" onclick="annulerVente(\'' + esc(f.numero) + '\', this)">Confirmer l\'annulation</button></div></details>';
  afficherFacture(f, 0, extra);
}

async function annulerVente(numero, btn){
  await occupe(btn, async () => {
    try {
      await api('apiAnnulerVente', S.token, numero, $('v-motif').value);
      fermerModale(); toast('Vente ' + numero + ' annulée — stock remis');
      try { C.data = await api('apiCaisse', S.token); } catch(e) {}
      historiqueVentes();
    } catch(e) { $('mod-msg').textContent = msgErreur(e); }
  });
}


/* ===== Étape 6 : Dépenses ===== */
const D = { data: null, mois: null, categorie: '' };

async function vueDepenses(){
  if (!D.mois) D.mois = aujourdhui().slice(0, 7);
  const mois = D.mois;
  await charger('depenses:' + mois, () => api('apiDepenses', S.token, mois),
    (d, maj) => { D.data = d; if (!maj || libre()) dessinerDepenses(); }, 'Dépenses');
}

function dessinerDepenses(){
  const d = D.data, ok = d.depenses.filter(x => x.statut !== 'Annulée');
  const total = ok.reduce((s, x) => s + x.montant, 0);
  const jour = aujourdhui().split('-').reverse().join('/');
  const totalJour = ok.filter(x => x.date === jour).reduce((s, x) => s + x.montant, 0);
  const parCat = {};
  ok.forEach(x => { parCat[x.categorie] = (parCat[x.categorie] || 0) + x.montant; });
  const cats = Object.keys(parCat).sort((a, b) => parCat[b] - parCat[a]);
  const l = d.depenses.filter(x => !D.categorie || x.categorie === D.categorie);
  $('vue').innerHTML = '<h2>Dépenses</h2>' +
    '<div class="stats">' +
      '<div class="stat"><small>Total du mois</small><b style="color:var(--err)">' + fcfa(total) + '</b></div>' +
      '<div class="stat"><small>Aujourd\'hui</small><b>' + fcfa(totalJour) + '</b></div>' +
      '<div class="stat"><small>Nombre de dépenses</small><b>' + ok.length + '</b></div>' +
    '</div>' +
    (cats.length ? '<div class="bloc" style="margin-bottom:14px"><b style="color:var(--bleu)">Par catégorie</b>' +
      cats.map(c => '<div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span style="width:190px;flex-shrink:0">' + esc(c) + '</span>' +
        '<div style="flex:1;background:var(--fond);border-radius:6px;height:12px"><div style="width:' + Math.max(3, Math.round(parCat[c] / total * 100)) +
        '%;background:var(--orange);height:12px;border-radius:6px"></div></div><b style="white-space:nowrap">' + fcfa(parCat[c]) + '</b></div>').join('') +
      '</div>' : '') +
    '<div class="bloc"><div class="entete-bloc" style="flex-wrap:wrap">' +
      '<input type="month" value="' + esc(d.mois) + '" max="' + aujourdhui().slice(0, 7) + '" style="max-width:190px" onchange="D.mois=this.value;vueDepenses()">' +
      '<select style="max-width:230px" onchange="D.categorie=this.value;dessinerDepenses()"><option value="">Toutes les catégories</option>' +
        d.categories.map(c => '<option' + (c === D.categorie ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>' +
      '<span style="flex:1"></span><button class="btn orange" onclick="nouvelleDepense()">+ Nouvelle dépense</button></div>' +
    (l.length ? '<div style="overflow-x:auto"><table><thead><tr><th>N°</th><th>Date</th><th>Catégorie</th><th>Libellé</th><th>Montant</th>' +
      '<th class="col-mobile-cache">Mode</th>' + (d.gerant ? '<th class="col-mobile-cache">Saisi par</th>' : '') + '<th class="col-mobile-cache">Statut</th></tr></thead><tbody>' +
      l.map(x => '<tr onclick="detailDepense(\'' + esc(x.numero) + '\')"' + (x.statut === 'Annulée' ? ' style="opacity:.55"' : '') + '>' +
        '<td>' + esc(x.numero) + '</td><td>' + esc(x.date) + '</td><td>' + esc(x.categorie) + '</td><td><b>' + esc(x.libelle) + '</b></td>' +
        '<td style="white-space:nowrap">' + fcfa(x.montant) + '</td><td class="col-mobile-cache">' + esc(x.mode) + '</td>' +
        (d.gerant ? '<td class="col-mobile-cache">' + esc(x.utilisateur) + '</td>' : '') +
        '<td class="col-mobile-cache"><span class="badge ' + (x.statut === 'Annulée' ? 'non' : 'oui') + '">' + esc(x.statut) + '</span></td></tr>').join('') +
      '</tbody></table></div>' : etatVide('portefeuille', 'Aucune dépense pour cette période', 'Notez ici chaque sortie d\'argent (loyer, transport, électricité…). Elle apparaît dans le point de caisse.',
        '<button class="btn orange" onclick="nouvelleDepense()">+ Nouvelle dépense</button>')) + '</div>';
}

function nouvelleDepense(){
  const d = D.data;
  modale('Nouvelle dépense',
    '<div class="grille">' +
      '<div><label>Catégorie</label><select id="d-cat"><option value="">— Choisir —</option>' +
        d.categories.map(c => '<option>' + esc(c) + '</option>').join('') + '</select></div>' +
      '<div><label>Date</label>' + (d.gerant ? '<input id="d-date" type="date" value="' + aujourdhui() + '" max="' + aujourdhui() + '">' :
        '<input id="d-date" value="Aujourd\'hui" disabled>') + '</div>' +
    '</div>' +
    '<label>Libellé</label><input id="d-lib" placeholder="Ex. : facture électricité octobre">' +
    aide(d.gerant ? 'La dépense est comptée dans le tableau de bord à la date choisie.' : 'La dépense est enregistrée à la date d\'aujourd\'hui, à votre nom.') +
    '<div class="grille">' +
      '<div><label>Montant</label><input id="d-mt" inputmode="decimal"></div>' +
      '<div><label>Mode de paiement</label><select id="d-mode">' + d.modes.map(m => '<option>' + esc(m) + '</option>').join('') + '</select></div>' +
    '</div>' +
    '<label>Bénéficiaire (facultatif)</label><input id="d-ben" placeholder="Ex. : CIE, propriétaire, transporteur…">',
    async () => {
      D.data = await api('apiEnregistrerDepense', S.token, { categorie: $('d-cat').value, date: $('d-date').value,
        libelle: $('d-lib').value, montant: $('d-mt').value, mode: $('d-mode').value, beneficiaire: $('d-ben').value, mois: D.mois });
      toast('Dépense enregistrée'); dessinerDepenses();
    });
}

function detailDepense(numero){
  const x = D.data.depenses.find(y => y.numero === numero);
  if (!x) return;
  const annulee = x.statut === 'Annulée';
  $('modale-zone').innerHTML = '<div class="voile"><div class="modale"><h3>Dépense ' + esc(x.numero) +
    (annulee ? ' <span class="badge non">Annulée</span>' : '') + '</h3>' +
    '<table><tbody>' +
      [['Date', x.date], ['Catégorie', x.categorie], ['Libellé', x.libelle], ['Montant', fcfa(x.montant)],
       ['Mode de paiement', x.mode], ['Bénéficiaire', x.beneficiaire || '—'], ['Saisi par', x.utilisateur]]
        .map(r => '<tr style="cursor:default"><td style="color:var(--gris)">' + r[0] + '</td><td><b>' + esc(r[1]) + '</b></td></tr>').join('') +
    '</tbody></table>' +
    (annulee ? '<p style="color:var(--err);margin-top:12px">Motif d\'annulation : ' + esc(x.motif) + '</p>' :
      (D.data.gerant ? '<details style="margin-top:16px"><summary style="cursor:pointer;color:var(--err)">Annuler cette dépense</summary>' +
        '<label>Motif de l\'annulation</label><input id="d-motif">' +
        '<div class="actions"><button class="btn" style="background:var(--err)" onclick="annulerDepense(\'' + esc(x.numero) + '\', this)">Confirmer l\'annulation</button></div></details>' : '')) +
    '<div class="msg" id="mod-msg"></div><div class="actions"><button class="btn second" onclick="fermerModale()">Fermer</button></div></div></div>';
}

async function annulerDepense(numero, btn){
  await occupe(btn, async () => {
    try {
      D.data = await api('apiAnnulerDepense', S.token, numero, $('d-motif').value, D.mois);
      fermerModale(); toast('Dépense ' + numero + ' annulée'); dessinerDepenses();
    } catch(e) { $('mod-msg').textContent = msgErreur(e); }
  });
}


/* ===== Étape 7 : Stock & inventaire ===== */
const K = { data: null, recherche: '', famille: '', bas: false, mode: 'article', tri: 'ancien', depot: '', mvt: null, tr: null };

async function vueStock(){
  await charger('stock', () => api('apiStock', S.token),
    (d, maj) => { K.data = d; if (!maj || libre()) dessinerStock(); }, 'Stock & inventaire');
}

function filtreStock(){
  const r = K.recherche.trim().toLowerCase();
  return K.data.articles.filter(a => (!K.famille || a.famille === K.famille) && (!K.bas || a.stock <= a.seuil) && (!K.depot || stockDe(a) !== 0) &&
    (!r || (a.designation + ' ' + a.code).toLowerCase().indexOf(r) >= 0));
}

function stockDe(a){ return K.depot ? (a.depots[K.depot] || 0) : a.stock; }
function nomDepot(code){ const x = ((K.data && K.data.depots) || []).find(d => d.code === code); return x ? x.nom : code; }

function dessinerStock(){
  const d = K.data, g = d.gerant, arts = d.articles;
  if (K.depot && !(d.depots || []).some(x => x.code === K.depot)) K.depot = '';
  const bas = arts.filter(a => a.stock > 0 && a.stock <= a.seuil).length, rupture = arts.filter(a => a.stock <= 0).length;
  const va = arts.reduce((s, a) => s + (K.depot ? Math.round(stockDe(a) * a.pa) : a.valeurAchat), 0);
  const vv = arts.reduce((s, a) => s + (K.depot ? Math.round(stockDe(a) * a.pv) : a.valeurVente), 0);
  const ou = K.depot ? ' — ' + esc(nomDepot(K.depot)) : '';
  const tete = '<h2>Stock & inventaire</h2><div class="stats">' +
      '<div class="stat"><small>Articles actifs</small><b>' + arts.length + '</b></div>' +
      '<div class="stat"><small>Stock bas</small><b style="color:' + (bas ? 'var(--orange)' : 'var(--ok)') + '">' + bas + '</b></div>' +
      '<div class="stat"><small>En rupture</small><b style="color:' + (rupture ? 'var(--err)' : 'var(--ok)') + '">' + rupture + '</b></div>' +
      (g ? '<div class="stat"><small>Valeur du stock' + ou + ' (prix d\'achat)</small><b>' + fcfa(va) + '</b></div>' +
           '<div class="stat"><small>Valeur du stock' + ou + ' (prix de vente)</small><b>' + fcfa(vv) + '</b></div>' : '') +
    '</div><div class="onglets">' +
      [['article', 'Stock par article'], ['lots', 'Par arrivage (lots)'], ['transferts', 'Transferts entre dépôts']].map(o =>
        '<button class="' + (K.mode === o[0] ? 'actif' : '') + '" onclick="K.mode=\'' + o[0] + '\';dessinerStock()">' + o[1] + '</button>').join('') +
    '</div>';
  if (K.mode === 'transferts') {
    $('vue').innerHTML = tete + '<div class="bloc"><div class="entete-bloc"><span style="color:var(--gris)">' + (d.transferts || []).length + ' transfert(s) récent(s)</span>' +
      (d.peutAjuster ? '<button class="btn orange" onclick="nouveauTransfert()">+ Nouveau transfert</button>' : '') + '</div><div id="k-liste"></div></div>';
    return listeTransferts();
  }
  $('vue').innerHTML = tete + (K.mode === 'lots' ? astuce('lots', '<b>Comment lire les lots :</b> chaque livraison est un lot daté. Les ventes puisent d\'abord dans le lot le plus ancien ; '
        + 'un âge en <b>orange</b> signale un lot en stock depuis plus de 90 jours.') : barreDepots()) +
    '<div class="bloc"><div class="entete-bloc" style="flex-wrap:wrap">' +
      '<input placeholder="Rechercher un article…" style="max-width:260px" value="' + esc(K.recherche) + '" oninput="K.recherche=this.value;listeStock()">' +
      '<select style="max-width:200px" onchange="K.famille=this.value;listeStock()"><option value="">Toutes les familles</option>' +
        d.familles.map(f => '<option' + (f === K.famille ? ' selected' : '') + '>' + esc(f) + '</option>').join('') + '</select>' +
      (K.mode === 'lots'
        ? '<select style="max-width:220px" onchange="K.tri=this.value;listeStock()">' +
            [['ancien', 'Plus anciens d\'abord'], ['recent', 'Plus récents d\'abord']].map(o =>
              '<option value="' + o[0] + '"' + (K.tri === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>'
        : '<label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:normal;color:var(--texte)"><input type="checkbox" style="width:auto"' +
            (K.bas ? ' checked' : '') + ' onchange="K.bas=this.checked;listeStock()"> Stock bas uniquement</label>') +
      '<span style="flex:1"></span><button class="btn second" onclick="imprimerInventaire()">Imprimer la fiche d\'inventaire</button>' +
    '</div><div id="k-liste"></div></div>';
  listeStock();
}

/** Cartes « emplacements » : cliquer sur un dépôt n'affiche que ce qu'il contient. */
function barreDepots(){
  const d = K.data, deps = (d.depots || []).filter(x => x.actif === 'Oui' || d.articles.some(a => a.depots[x.code]));
  if (deps.length < 2) return d.gerant ? astuce('depots', '<b>Plusieurs lieux de stockage ?</b> Créez vos dépôts dans <b>Paramètres → Dépôts</b> : '
    + 'vous verrez ici le stock de chacun et pourrez transférer la marchandise vers le magasin.') : '';
  const carte = (code, nom, n, ic) => '<button class="depot-carte' + (K.depot === code ? ' actif' : '') + '" onclick="K.depot=\'' + code + '\';dessinerStock()">' +
    '<span class="pt">' + ico(ic, 17, 'var(--bleu2)') + '</span><span><b>' + esc(nom) + '</b><small>' + n + ' article(s) en stock</small></span></button>';
  return '<div class="depots-barre">' + carte('', 'Tous les emplacements', d.articles.filter(a => a.stock > 0).length, 'boite') +
    deps.map(x => carte(x.code, x.nom, d.articles.filter(a => (a.depots[x.code] || 0) > 0).length, x.code === MAG ? 'panier' : 'entrepot')).join('') + '</div>';
}

function listeStock(){
  if (K.mode === 'lots') return listeLots();
  if (K.mode === 'transferts') return listeTransferts();
  const d = K.data, g = d.gerant, l = filtreStock();
  const plusieurs = (d.depots || []).length > 1;
  if (!l.length) {
    $('k-liste').innerHTML = K.depot
      ? etatVide('entrepot', 'Rien à afficher dans « ' + esc(nomDepot(K.depot)) + ' »', 'Aucun article en stock ne correspond dans cet emplacement.')
      : '<div class="vide">Aucun article.</div>';
    return;
  }
  $('k-liste').innerHTML = '<p style="color:var(--gris);margin:0 0 10px">' + (K.depot ? '<b style="color:var(--bleu)">' + esc(nomDepot(K.depot)) + '</b> · ' : '') +
    'Cliquez sur un article pour voir ses mouvements' + (d.peutAjuster ? (plusieurs ? ', le transférer' : '') + ' ou corriger son stock après comptage' : '') + '.</p>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Code</th><th>Désignation</th><th class="col-mobile-cache">Famille</th>' +
    '<th>' + (K.depot ? 'Quantité ici' : 'Stock total') + '</th>' +
    '<th class="col-mobile-cache">Seuil</th>' + (g ? '<th class="col-mobile-cache">Valeur (achat)</th>' : '') + '</tr></thead><tbody>' +
    l.map(a => {
      const q = stockDe(a);
      const cls = K.depot ? (q > 0 ? 'oui' : 'non') : (a.stock <= a.seuil ? 'non' : 'oui');
      const rep = plusieurs && !K.depot ? (d.depots || []).filter(x => a.depots[x.code]).map(x =>
        '<span>' + esc(x.nom) + ' : <b>' + a.depots[x.code].toLocaleString('fr-FR') + '</b></span>').join(' · ') : '';
      return '<tr onclick="mouvementsArticle(\'' + esc(a.code) + '\')"><td>' + esc(a.code) + '</td><td><b>' + esc(a.designation) + '</b>' +
        (rep ? '<small class="repartition">' + rep + '</small>' : '') + '</td>' +
        '<td class="col-mobile-cache">' + esc(a.famille) + '</td>' +
        '<td><span class="badge ' + cls + '">' + (q <= 0 && !K.depot ? 'Rupture' : q.toLocaleString('fr-FR') + ' ' + esc(a.unite.toLowerCase())) + '</span></td>' +
        '<td class="col-mobile-cache">' + a.seuil + '</td>' +
        (g ? '<td class="col-mobile-cache">' + fcfa(K.depot ? Math.round(q * a.pa) : a.valeurAchat) + '</td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

function listeTransferts(){
  const l = K.data.transferts || [];
  if (!l.length) {
    $('k-liste').innerHTML = etatVide('fleches', 'Aucun transfert pour le moment',
      'Un transfert déplace de la marchandise d\'un dépôt à un autre, par exemple du dépôt vers le magasin pour pouvoir la vendre. Le stock total ne change pas.',
      K.data.peutAjuster ? '<button class="btn orange" onclick="nouveauTransfert()">+ Nouveau transfert</button>' : '');
    return;
  }
  $('k-liste').innerHTML = '<div style="overflow-x:auto"><table><thead><tr><th>N°</th><th>Date</th><th>Trajet</th><th>Articles</th><th class="col-mobile-cache">Par</th></tr></thead><tbody>' +
    l.map(t => '<tr style="cursor:default"><td>' + esc(t.numero) + '</td><td style="white-space:nowrap">' + esc(t.date) + '</td>' +
      '<td><b>' + esc(t.de) + '</b> → <b>' + esc(t.vers) + '</b>' + (t.motif ? '<br><small style="color:var(--gris)">' + esc(t.motif) + '</small>' : '') + '</td>' +
      '<td>' + t.lignes.map(x => esc(x.designation) + ' : <b>' + x.quantite.toLocaleString('fr-FR') + '</b> ' + esc(String(x.unite).toLowerCase())).join('<br>') + '</td>' +
      '<td class="col-mobile-cache">' + esc(t.utilisateur) + '</td></tr>').join('') +
    '</tbody></table></div>';
}

/** Formulaire de transfert. code : article pré-choisi (depuis sa fiche). */
function nouveauTransfert(code){
  const d = K.data, deps = (d.depots || []).filter(x => x.actif === 'Oui');
  if (deps.length < 2) return toast(d.gerant ? 'Créez d\'abord un autre dépôt dans Paramètres → Dépôts.' : 'Il n\'y a qu\'un seul emplacement : le gérant doit d\'abord créer les dépôts.', true);
  const a = code ? d.articles.find(x => x.code === code) : null;
  const autre = (deps.find(x => x.code !== MAG) || deps[0]).code;
  const de = (a && Object.keys(a.depots).find(c => c !== MAG && a.depots[c] > 0 && deps.some(x => x.code === c))) ||
             (K.depot && K.depot !== MAG && deps.some(x => x.code === K.depot) ? K.depot : autre);
  const vers = de === MAG ? autre : MAG;
  K.tr = { de: de, lignes: [{ article: code || '', qte: '' }] };
  const opts = v => deps.map(x => '<option value="' + esc(x.code) + '"' + (x.code === v ? ' selected' : '') + '>' + esc(x.nom) + '</option>').join('');
  fermerModale();
  modale('Nouveau transfert',
    aide('Déplace la marchandise d\'un emplacement à un autre : le stock total ne change pas. Pour être vendu, un article doit être au <b>magasin</b>.') +
    '<div class="grille"><div><label>De (départ)</label><select id="tr-de" onchange="K.tr.de=this.value;dessinerLignesTransfert()">' + opts(de) + '</select></div>' +
    '<div><label>Vers (arrivée)</label><select id="tr-vers">' + opts(vers) + '</select></div></div>' +
    '<label style="margin-top:16px">Articles à déplacer</label><div id="tr-lignes"></div>' +
    '<button class="btn second" onclick="K.tr.lignes.push({article:\'\',qte:\'\'});dessinerLignesTransfert()">+ Ajouter une ligne</button>' +
    '<label>Motif (facultatif)</label><input id="tr-motif" placeholder="Ex. : réassort de la boutique">',
    async () => {
      const r = await api('apiTransferer', S.token, { de: $('tr-de').value, vers: $('tr-vers').value, lignes: K.tr.lignes, motif: $('tr-motif').value });
      K.data = r; K.mode = 'transferts'; toast('Transfert ' + r.numeroCree + ' enregistré'); dessinerStock();
    }, true);
  dessinerLignesTransfert();
}

function dessinerLignesTransfert(){
  const d = K.data, de = K.tr.de, dispo = a => a.depots[de] || 0;
  const arts = d.articles.filter(a => dispo(a) > 0 || K.tr.lignes.some(l => l.article === a.code));
  $('tr-lignes').innerHTML = K.tr.lignes.map((l, i) => {
    const a = d.articles.find(x => x.code === l.article);
    return '<div class="ligne-achat ligne-tr">' +
      '<select onchange="K.tr.lignes[' + i + '].article=this.value;dessinerLignesTransfert()"><option value="">— Article —</option>' +
        arts.map(x => '<option value="' + esc(x.code) + '"' + (x.code === l.article ? ' selected' : '') + '>' + esc(x.designation) + ' (' + dispo(x).toLocaleString('fr-FR') + ')</option>').join('') + '</select>' +
      '<input inputmode="decimal" placeholder="Qté" value="' + esc(l.qte) + '" oninput="K.tr.lignes[' + i + '].qte=this.value">' +
      '<span class="st" style="font-weight:normal;color:var(--gris)">' + (a ? 'Disponible : <b style="color:var(--texte)">' + dispo(a).toLocaleString('fr-FR') + '</b>' : '') + '</span>' +
      '<button class="btn second" title="Retirer la ligne" onclick="K.tr.lignes.splice(' + i + ',1);if(!K.tr.lignes.length)K.tr.lignes.push({article:\'\',qte:\'\'});dessinerLignesTransfert()">✕</button></div>';
  }).join('') + (arts.length ? '' : '<p style="color:var(--gris);margin:0 0 10px">Aucun article en stock dans cet emplacement.</p>');
}

async function mouvementsArticle(code){
  let d;
  try { d = await api('apiMouvements', S.token, code); } catch(e) { return toast(msgErreur(e), true); }
  K.mvt = d;
  const u = d.unite.toLowerCase(), plusieurs = d.depots.length > 1 || d.parDepot.length > 1, peut = K.data.peutAjuster;

function listeLots(){
  const d = K.data, g = d.gerant, r = K.recherche.trim().toLowerCase();
  const l = (d.lots || []).filter(x => (!K.famille || x.famille === K.famille) &&
      (!r || (x.designation + ' ' + x.code + ' ' + x.ref).toLowerCase().indexOf(r) >= 0))
    .sort((a, b) => (K.tri === 'recent' ? -1 : 1) * ((a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0) || (a.code === b.code ? a.n - b.n : 0)) ||
      a.designation.localeCompare(b.designation) || a.n - b.n);
  if (!l.length) { $('k-liste').innerHTML = etatVide('lots', 'Aucun lot en stock', 'Un lot se crée à chaque livraison enregistrée dans Achats & livraisons.'); return; }
  const anciens = l.filter(x => x.age >= 90).length;
  $('k-liste').innerHTML = '<p style="color:var(--gris);margin:0 0 10px">' + l.length + ' lot(s) en stock. Les ventes puisent d\'abord dans le lot le plus ancien.' +
      (anciens ? ' · <b style="color:var(--orange)">' + anciens + ' lot(s) de plus de 90 jours</b>' : '') + '</p>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>Arrivée</th><th>Lot</th><th>Article</th>' +
      (g ? '<th class="col-mobile-cache">Fournisseur</th>' : '') + '<th class="col-mobile-cache">Reçu</th><th>Reste</th><th>Âge</th>' +
      (g ? '<th class="col-mobile-cache">Valeur (achat)</th>' : '') + '</tr></thead><tbody>' +
    l.map(x => '<tr onclick="mouvementsArticle(\'' + esc(x.code) + '\')"><td>' + esc(x.date) + '</td><td>' + esc(x.ref) + '</td>' +
      '<td><b>' + esc(x.designation) + '</b><br><small style="color:var(--gris)">' + esc(x.famille) + '</small></td>' +
      (g ? '<td class="col-mobile-cache">' + esc(x.fournisseur || '—') + '</td>' : '') +
      '<td class="col-mobile-cache">' + x.recu.toLocaleString('fr-FR') + '</td>' +
      '<td><span class="badge oui">' + x.reste.toLocaleString('fr-FR') + ' ' + esc(x.unite.toLowerCase()) + '</span></td>' +
      '<td style="white-space:nowrap' + (x.age >= 90 ? ';color:var(--orange);font-weight:bold' : '') + '">' + x.age + ' j</td>' +
      (g ? '<td class="col-mobile-cache">' + fcfa(x.valeur) + '</td>' : '') + '</tr>').join('') +
    '</tbody></table></div>';
}

function filtrerAide(q){
  q = String(q || '').trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('#aide-liste .guide').forEach(d => {
    const ok = !q || d.textContent.toLowerCase().indexOf(q) >= 0;
    d.classList.toggle('cache', !ok);
    if (ok) n++;
    if (q && ok) d.open = true;
  });
  $('aide-vide').classList.toggle('cache', n > 0);
}

function ecartInventaire(){
  const d = K.mvt;
  if (!d || !$('k-compte')) return;
  const dep = $('k-depot') ? $('k-depot').value : MAG;
  const p = d.parDepot.find(x => x.code === dep), theo = p ? p.qte : 0;
  $('k-theo').textContent = 'Selon le logiciel : ' + theo.toLocaleString('fr-FR') + ' ' + d.unite.toLowerCase();
  const v = $('k-compte').value.trim(), e = $('k-ecart');
  if (v === '') { e.textContent = '—'; e.style.color = ''; return; }
  const ecart = Math.round((numVal(v) - theo) * 1000) / 1000;
  e.textContent = (ecart > 0 ? '+' : '') + ecart.toLocaleString('fr-FR') + (ecart === 0 ? ' (aucun écart)' : ecart > 0 ? ' (surplus)' : ' (manquant)');
  e.style.color = ecart < 0 ? 'var(--err)' : ecart > 0 ? 'var(--ok)' : 'var(--gris)';
}

async function validerAjustement(code, btn){
  await occupe(btn, async () => {
    try {
      K.data = await api('apiAjusterStock', S.token, { article: code, compte: $('k-compte').value, motif: $('k-motif').value,
        depot: $('k-depot') ? $('k-depot').value : MAG });
      toast('Stock corrigé'); dessinerStock(); mouvementsArticle(code);
    } catch(e) { $('mod-msg').textContent = msgErreur(e); }
  });
}

        '<td style="color:var(--err)"><b>' + fcfa(t.solde) + '</b></td></tr>').join('') + '</tbody></table></div>' :
      (d.tiers.length ? etatVide('portefeuille', 'Aucun résultat', 'Vérifiez le nom ou le numéro de téléphone.')
        : etatVide('bouclier', cli ? 'Aucun impayé' : 'Rien à payer', cli ? 'Tous vos clients sont à jour. Les ventes à crédit apparaîtront ici.' : 'Vous ne devez rien aux fournisseurs.'))) +
    '</div>' +
    '<div class="bloc"><h3 style="margin:0 0 10px;color:var(--bleu);font-size:16px">' + (cli ? (d.gerant ? 'Derniers règlements reçus' : 'Mes encaissements') : 'Derniers paiements aux fournisseurs') + '</h3>' +
    (d.reglements.length ? '<div style="overflow-x:auto;max-height:420px"><table><thead><tr><th>N°</th><th>Date</th><th>' + (cli ? 'Client' : 'Fournisseur') + '</th><th>Montant</th>' +
      '<th class="col-mobile-cache">Mode</th><th class="col-mobile-cache">Par</th><th class="col-mobile-cache">Statut</th></tr></thead><tbody>' +
      d.reglements.map(x => '<tr onclick="voirRecu(\'' + esc(x.numero) + '\')"' + (x.statut === 'Annulé' ? ' style="opacity:.55"' : '') + '>' +
        '<td>' + esc(x.numero) + '</td><td>' + esc(x.date) + '</td><td>' + esc(x.tiers) + '</td><td><b>' + fcfa(x.montant) + '</b></td>' +
        '<td class="col-mobile-cache">' + esc(x.mode) + '</td><td class="col-mobile-cache">' + esc(x.utilisateur) + '</td>' +
        '<td class="col-mobile-cache"><span class="badge ' + (x.statut === 'Annulé' ? 'non' : 'oui') + '">' + esc(x.statut) + '</span></td></tr>').join('') +
      '</tbody></table></div>' : '<div class="vide">Aucun règlement enregistré.</div>') + '</div>';
}

function ficheImpaye(code){
  const d = I.data, t = d.tiers.find(x => x.code === code), cli = d.type === 'Client';
  if (!t) return;
  modale((cli ? 'Client : ' : 'Fournisseur : ') + t.nom,
    '<p style="margin:0 0 6px;color:var(--gris)">' + (t.telephone ? 'Tél. : ' + esc(t.telephone) : '') + '</p>' +
    '<p style="font-size:18px;margin:0 0 14px">Reste à payer : <b style="color:var(--err);font-size:22px">' + fcfa(t.solde) + '</b></p>' +
    '<b style="color:var(--bleu)">' + (cli ? 'Factures non soldées' : 'Achats non soldés') + '</b>' +
    '<div style="overflow-x:auto;margin:6px 0 10px"><table><thead><tr><th>N°</th><th>Date</th><th style="text-align:right">Montant initial dû</th><th style="text-align:right">Reste</th></tr></thead><tbody>' +
      t.docs.map(x => '<tr style="cursor:default"><td>' + esc(x.numero) + '</td><td>' + esc(x.date) + '</td><td style="text-align:right">' + fcfa(x.montant) +
        '</td><td style="text-align:right;color:var(--err)"><b>' + fcfa(x.restant) + '</b></td></tr>').join('') +
    '</tbody></table></div>' +
    '<b style="color:var(--bleu)">' + (cli ? 'Encaisser un paiement' : 'Payer le fournisseur') + '</b>' +
    aide('Le paiement règle d\'abord la facture la plus ancienne. Un reçu s\'affiche ensuite, prêt à imprimer.') +
    '<div class="grille">' +
      '<div><label>Montant</label><div style="display:flex;gap:8px"><input id="i-mt" inputmode="decimal">' +
        '<button class="btn second" style="white-space:nowrap" onclick="$(\'i-mt\').value=' + t.solde + '">Tout</button></div></div>' +
      '<div><label>Mode de paiement</label><select id="i-mode">' + d.modes.map(m => '<option>' + esc(m) + '</option>').join('') + '</select></div>' +
    '</div><label>Note (facultatif)</label><input id="i-note" placeholder="Ex. : avance, solde facture…">',
    async () => {
      const r = await api('apiEnregistrerReglement', S.token, { type: d.type, tiers: t.code, montant: $('i-mt').value,
        mode: $('i-mode').value, note: $('i-note').value });
      I.data = r.data; dessinerImpayes(); toast('Règlement ' + r.recu.numero + ' enregistré');
      setTimeout(() => afficherRecu(r.recu), 0);
    }, true);
}

function htmlRecu(r){
  const e = r.entreprise, dev = e.devise, cli = r.type === 'Client';
  const m = n => (Number(n) || 0).toLocaleString('fr-FR') + ' ' + dev;
  return (r.statut === 'Annulé' ? '<div class="annulee">REÇU ANNULÉ</div>' : '') +
    '<div class="ent"><div><h1>' + esc(e.nom) + '</h1>' + (e.activite ? '<div>' + esc(e.activite) + '</div>' : '') +
      (e.adresse ? '<div>' + esc(e.adresse) + '</div>' : '') + (e.tel ? '<div>Tél. : ' + esc(e.tel) + '</div>' : '') + '</div>' +
    '<div class="num"><div>' + (cli ? 'REÇU DE PAIEMENT N°' : 'PAIEMENT FOURNISSEUR N°') + '</div><b>' + esc(r.numero) + '</b>' +
      '<div>Date : ' + esc(r.date) + '</div><div>' + (cli ? 'Reçu par' : 'Payé par') + ' : ' + esc(r.utilisateur) + '</div></div></div>' +
    '<p style="font-size:15px">' + (cli ? 'Reçu de' : 'Payé à') + ' : <b>' + esc(r.tiers) + '</b>' + (r.telephone ? ' — ' + esc(r.telephone) : '') + '</p>' +
    '<p style="font-size:15px">La somme de : <b style="font-size:20px">' + m(r.montant) + '</b></p>' +
    '<p>Soit : <b>' + esc(enLettres(r.montant)) + ' ' + (dev === 'FCFA' ? 'francs CFA' : esc(dev)) + '</b></p>' +
    '<p>Mode de paiement : <b>' + esc(r.mode) + '</b>' + (r.note ? ' · ' + esc(r.note) : '') + '</p>' +
    '<p>Solde restant dû à ce jour : <b style="color:' + (r.soldeRestant > 0 ? '#B3261E' : '#1E7B45') + '">' + m(r.soldeRestant) + '</b></p>' +
    '<div class="pied"><span>Signature ' + (cli ? 'du client' : 'du fournisseur') + '</span><span>Signature et cachet</span></div>';
}

function afficherRecu(r, extra){
  I.recu = r;
  $('modale-zone').innerHTML = '<div class="voile"><div class="modale large"><div class="fact apercu">' + htmlRecu(r) + '</div>' + (extra || '') +
    '<div class="msg" id="mod-msg"></div><div class="actions"><button class="btn second" onclick="fermerModale()">Fermer</button>' +
    '<button class="btn orange" onclick="imprimerRecu()">Imprimer le reçu</button></div></div></div>';
}

function imprimerRecu(){
  $('impression').innerHTML = '<div class="fact">' + htmlRecu(I.recu) + '</div>';
  window.print();
}

async function voirRecu(numero){
  let r;
  try { r = await api('apiRecu', S.token, numero); } catch(e) { return toast(msgErreur(e), true); }
  let extra = '';
  if (r.statut === 'Annulé') extra = '<p style="color:var(--err);margin-top:12px">Motif d\'annulation : ' + esc(r.motif) + '</p>';
  else if (I.data.gerant) extra = '<details style="margin-top:16px"><summary style="cursor:pointer;color:var(--err)">Annuler ce règlement</summary>' +
    '<label>Motif de l\'annulation (le montant redeviendra dû)</label><input id="i-motif">' +
    '<div class="actions"><button class="btn" style="background:var(--err)" onclick="annulerReglement(\'' + esc(r.numero) + '\', this)">Confirmer l\'annulation</button></div></details>';
  afficherRecu(r, extra);
}

async function annulerReglement(numero, btn){
  await occupe(btn, async () => {
    try {
      await api('apiAnnulerReglement', S.token, numero, $('i-motif').value);
      fermerModale(); toast('Règlement ' + numero + ' annulé'); vueImpayes();
    } catch(e) { $('mod-msg').textContent = msgErreur(e); }
  });
}

/* ===== Étape 9 : Tableau de bord ===== */
const B = { data: null, du: null, au: null };
function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function frDate(s){ return String(s || '').split('-').reverse().join('/'); }

async function vueTableauBord(){
  if (!B.au) { B.au = aujourdhui(); B.du = B.au.slice(0, 8) + '01'; }
  const du = B.du, au = B.au;
  await charger('tb:' + du + ':' + au, () => api('apiTableauBord', S.token, du, au),
    (d, maj) => { B.data = d; if (!maj || libre()) dessinerTableauBord(); }, 'Tableau de bord');
}

function periodeTB(p){
  const a = aujourdhui();
  if (p === 'jour') { B.du = a; B.au = a; }
  else if (p === 'semaine') { const x = new Date(); x.setDate(x.getDate() - (x.getDay() + 6) % 7); B.du = isoDate(x); B.au = a; }
  else if (p === 'mois') { B.du = a.slice(0, 8) + '01'; B.au = a; }
  else if (p === 'moisPrec') { const x = new Date(); x.setDate(1); x.setMonth(x.getMonth() - 1); B.du = isoDate(x);
    const y = new Date(); y.setDate(0); B.au = isoDate(y); }
  else if (p === 'annee') { B.du = a.slice(0, 5) + '01-01'; B.au = a; }
  vueTableauBord();
}

function tbSection(titre, html){
  return '<div class="bloc" style="margin-bottom:14px;break-inside:avoid"><h3 style="margin:0 0 10px;color:var(--bleu);font-size:16px">' + titre + '</h3>' + html + '</div>';
}

function tbTable(entetes, lignes, vide){
  if (!lignes.length) return '<div class="vide" style="padding:14px">' + (vide || 'Aucune donnée sur la période.') + '</div>';
  const d = 'style="text-align:right;white-space:nowrap"';
  return '<div style="overflow-x:auto"><table><thead><tr>' + entetes.map((h, i) => '<th ' + (i ? d : '') + '>' + h + '</th>').join('') +
    '</tr></thead><tbody>' + lignes.map(l => '<tr style="cursor:default">' + l.map((c, i) => '<td ' + (i ? d : '') + '>' + c + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

function dessinerTableauBord(){
  const d = B.data;
  const st = (lib, val, coul) => '<div class="stat"><small>' + lib + '</small><b' + (coul ? ' style="color:' + coul + '"' : '') + '>' + val + '</b></div>';
  const maxJour = Math.max(1, ...d.parJour.map(x => x.ca));
  const totCaisse = d.caisse.reduce((s, x) => ({ e: s.e + x.entrees, s: s.s + x.sorties }), { e: 0, s: 0 });
  $('vue').innerHTML = '<h2>Tableau de bord</h2>' +
    '<div class="bloc" style="margin-bottom:14px"><div class="entete-bloc" style="flex-wrap:wrap;margin:0">' +
      '<span>Du</span><input type="date" value="' + d.du + '" style="max-width:170px" onchange="B.du=this.value;vueTableauBord()">' +
      '<span>au</span><input type="date" value="' + d.au + '" max="' + aujourdhui() + '" style="max-width:170px" onchange="B.au=this.value;vueTableauBord()">' +
      [['jour', 'Aujourd\'hui'], ['semaine', 'Cette semaine'], ['mois', 'Ce mois'], ['moisPrec', 'Mois dernier'], ['annee', 'Cette année']]
        .map(p => '<button class="btn second" style="padding:8px 12px" onclick="periodeTB(\'' + p[0] + '\')">' + p[1] + '</button>').join('') +
      '<span style="flex:1"></span><button class="btn" onclick="imprimerTableauBord()">Imprimer le rapport</button>' +
    '</div></div>' +
    '<div id="tb-contenu">' +
    '<div class="stats">' +
      st('Chiffre d\'affaires', fcfa(d.ca)) +
      st('Coût des articles vendus', fcfa(d.cout)) +
      st('Marge brute', fcfa(d.margeBrute), d.margeBrute < 0 ? 'var(--err)' : 'var(--ok)') +
      st('Dépenses', fcfa(d.depenses), 'var(--err)') +
      st('Bénéfice net', fcfa(d.benefice), d.benefice < 0 ? 'var(--err)' : 'var(--ok)') +
    '</div><div class="stats">' +
      st('Nombre de ventes', d.nbVentes + (d.nbVentes ? ' <small style="display:inline;font-size:12px;color:var(--gris)">(panier moyen ' + fcfa(Math.round(d.ca / d.nbVentes)) + ')</small>' : '')) +
      st('Encaissé sur ventes', fcfa(d.encaisseVentes), 'var(--ok)') +
      st('Crédit accordé', fcfa(d.credit), d.credit ? 'var(--err)' : '') +
      st('Règlements clients reçus', fcfa(d.reglClients), 'var(--ok)') +
      st('Achats de marchandises', fcfa(d.achats)) +
    '</div>' +
    '<h3 style="color:var(--bleu);margin:6px 0 10px">Situation à ce jour</h3><div class="stats">' +
      st('Les clients vous doivent', fcfa(d.creancesClients), d.creancesClients ? 'var(--err)' : '') +
      st('Vous devez aux fournisseurs', fcfa(d.dettesFournisseurs), d.dettesFournisseurs ? 'var(--err)' : '') +
      st('Valeur du stock (prix d\'achat)', fcfa(d.valeurStock)) +
      st('Articles en rupture', d.ruptures, d.ruptures ? 'var(--err)' : 'var(--ok)') +
    '</div>' +
    tbSection('Chiffre d\'affaires par jour', d.parJour.length ? d.parJour.map(x =>
      '<div style="display:flex;align-items:center;gap:10px;margin:5px 0"><span style="width:80px;flex-shrink:0;color:var(--gris)">' + frDate(x.jour).slice(0, 5) + '</span>' +
      '<div style="flex:1;background:var(--fond);border-radius:6px;height:14px"><div style="width:' + Math.max(2, Math.round(x.ca / maxJour * 100)) +
      '%;background:var(--bleu);height:14px;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact"></div></div>' +
      '<b style="width:130px;text-align:right;white-space:nowrap">' + fcfa(x.ca) + '</b></div>').join('') : '<div class="vide" style="padding:14px">Aucune vente sur la période.</div>') +
    tbSection('Point de caisse par mode de paiement', tbTable(['Mode', 'Entrées', 'Sorties', 'Solde'],
      d.caisse.map(x => [esc(x.mode), fcfa(x.entrees), fcfa(x.sorties), '<b>' + fcfa(x.solde) + '</b>'])
        .concat(d.caisse.length ? [['<b>Total</b>', '<b>' + fcfa(totCaisse.e) + '</b>', '<b>' + fcfa(totCaisse.s) + '</b>', '<b>' + fcfa(totCaisse.e - totCaisse.s) + '</b>']] : [])) +
      '<p style="color:var(--gris);font-size:13px;margin:8px 0 0">Entrées = ventes encaissées + règlements clients. Sorties = dépenses + paiements fournisseurs.</p>') +
    tbSection('Bilan par caissière / utilisateur', tbTable(['Nom', 'Ventes', 'Chiffre d\'affaires', 'Encaissé', 'Crédit', 'Règlements reçus', 'Dépenses'],
      d.parCaissier.map(x => [esc(x.nom), x.nb, fcfa(x.ca), fcfa(x.encaisse), fcfa(x.credit), fcfa(x.reglements), fcfa(x.depenses)]))) +
    tbSection('Articles vendus', tbTable(['Article', 'Famille', 'Quantité', 'Chiffre d\'affaires', 'Marge'],
      d.parArticle.map(x => [esc(x.designation) + ' <small style="color:var(--gris)">' + esc(x.code) + '</small>', esc(x.famille),
        x.qte.toLocaleString('fr-FR'), fcfa(x.ca), '<span style="color:' + (x.marge < 0 ? 'var(--err)' : 'var(--ok)') + '">' + fcfa(Math.round(x.marge)) + '</span>']))) +
    tbSection('Chiffre d\'affaires par client', tbTable(['Client', 'Ventes', 'Chiffre d\'affaires'],
      d.parClient.map(x => [esc(x.nom), x.nb, fcfa(x.ca)]))) +
    tbSection('Achats par fournisseur', tbTable(['Fournisseur', 'Achats', 'Montant'],
      d.parFournisseur.map(x => [esc(x.nom), x.nb, fcfa(x.total)]))) +
    tbSection('Dépenses par catégorie', tbTable(['Catégorie', 'Montant'],
      d.parCategorie.map(x => [esc(x.categorie), fcfa(x.montant)]))) +
    '</div>';
}

function imprimerTableauBord(){
  const d = B.data;
  $('impression').innerHTML = '<div class="fact"><div class="ent"><div><h1>' + esc(d.entreprise) + '</h1><div>Tableau de bord</div></div>' +
    '<div class="num"><div>Période</div><b>' + frDate(d.du) + ' → ' + frDate(d.au) + '</b></div></div>' + $('tb-contenu').innerHTML + '</div>';
  window.print();
}

demarrer();
</script>
</body>
</html>
